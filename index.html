/* ==================== APP ==================== */
const S = {lang:'ar', theme:'dark', level:'year', selMonth:null};
const $ = s => document.querySelector(s);
const LEVELS = ['year','month','week','day','occ'];
const OCC_ORDER = ['dua','people','travel','nature','quran'];
const DAY_CONTENT = ['wake','fajr','withPrayer','duha','dhuhr','asr','maghrib','isha','night','sleep'];
/* Hijri today via Umm al-Qura calendar */
const TODAY = (()=>{ try{
  const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric'})
    .formatToParts(new Date());
  const g={}; parts.forEach(p=>g[p.type]=p.value);
  const m=parseInt(g.month,10)-1, d=parseInt(g.day,10);
  if(isNaN(m)||isNaN(d)) return null;
  return {m, d, w:new Date().getDay()};
}catch(e){ return null; } })();
const SACRED = [0,6,10,11]; // Muharram, Rajab, Dhul-Qa'dah, Dhul-Hijjah
const DAY_ORDER = ['wake','fajr','duha','dhuhr','asr','maghrib','isha','night','sleep'];
const AR_NUM = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const t = () => L[S.lang];

/* ---------- controls ---------- */
function applyChrome(){
  const html=document.documentElement;
  html.lang = S.lang; html.dir = S.lang==='ar' ? 'rtl':'ltr';
  html.dataset.theme = S.theme;
  $('#langLbl').textContent = t().langBtn;
  $('#themeLbl').textContent = t().theme[S.theme];
  $('#themeIco').innerHTML = S.theme==='dark'
    ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
  $('#appTitle').textContent = t().title;
  $('#appSubtitle').textContent = t().subtitle;
  $('#tagline').textContent = t().tagline;
  $('#footNote').textContent = t().foot;
}
$('#langBtn').onclick = () => { S.lang = S.lang==='ar'?'en':'ar'; applyChrome(); renderNav(); render(false); };
$('#themeBtn').onclick = () => { S.theme = S.theme==='dark'?'light':'dark'; applyChrome(); };

/* ---------- orbit nav ---------- */
function ringsSVG(activeIdx){
  const radii=[6,10,14,18,22];
  let c = radii.map((r,i)=>`<circle cx="26" cy="26" r="${r}" class="${i===activeIdx?'active-ring':''}"/>`).join('');
  return `<svg class="rings" viewBox="0 0 52 52">${c}<circle class="core" cx="26" cy="26" r="3"/></svg>`;
}
function renderNav(){
  $('#orbitNav').innerHTML = LEVELS.map((lv,i)=>`
    <button class="orbit-btn ${S.level===lv?'on':''}" data-lv="${lv}" aria-pressed="${S.level===lv}">
      ${ringsSVG(i)}
      <span class="lbl">${t().levels[lv]}</span>
      <span class="sub">${t().levelSub[lv]}</span>
    </button>`).join('');
  document.querySelectorAll('.orbit-btn').forEach(b=>{
    b.onclick=()=>{ if(b.dataset.lv!==S.level){
      const zoomIn = LEVELS.indexOf(b.dataset.lv) > LEVELS.indexOf(S.level);
      S.level=b.dataset.lv; S.selMonth=null; renderNav(); render(true, zoomIn);
    }};
  });
}

/* ---------- stage visuals ---------- */
function polar(cx,cy,r,a){ return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
function segPath(cx,cy,r1,r2,a1,a2){
  const [x1,y1]=polar(cx,cy,r2,a1),[x2,y2]=polar(cx,cy,r2,a2),
        [x3,y3]=polar(cx,cy,r1,a2),[x4,y4]=polar(cx,cy,r1,a1);
  return `M${x1} ${y1} A${r2} ${r2} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r1} ${r1} 0 0 0 ${x4} ${y4} Z`;
}
function yearWheel(){
  const cx=230,cy=230,r1=118,r2=214,gap=0.035;
  const monthsWithSunan = new Set(E.filter(e=>e.level==='year').map(e=>e.anchor));
  let segs='';
  for(let i=0;i<12;i++){
    const a1=-Math.PI/2 + i*(Math.PI*2/12)+gap, a2=-Math.PI/2 + (i+1)*(Math.PI*2/12)-gap;
    const mid=(a1+a2)/2, [tx,ty]=polar(cx,cy,(r1+r2)/2,mid), [dx,dy]=polar(cx,cy,r2-16,mid);
    const has=monthsWithSunan.has(i), sacred=SACRED.includes(i);
    let sacredArc='';
    if(sacred){ const [sx1,sy1]=polar(cx,cy,r1-8,a1),[sx2,sy2]=polar(cx,cy,r1-8,a2);
      sacredArc=`<path class="sacred-mark" d="M${sx1} ${sy1} A${r1-8} ${r1-8} 0 0 1 ${sx2} ${sy2}"/>`; }
    const tnow = TODAY && TODAY.m===i;
    segs+=`<g class="wheel-seg ${has?'has-sunan':''} ${S.selMonth===i?'sel':''} ${tnow?'tnow':''}" data-m="${i}" role="button" tabindex="0" aria-label="${t().months[i]}">
      <path class="arc" d="${segPath(cx,cy,r1,r2,a1,a2)}"/>
      ${has?`<circle class="dot" cx="${dx}" cy="${dy}" r="3.4"/>`:''}
      <text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle">${t().months[i]}</text>
      ${sacredArc}</g>`;
  }
  return `<div class="wheel-holder"><svg class="year-wheel" viewBox="0 0 460 460">
    ${segs}
    <text class="wheel-center-t" x="${cx}" y="${cy-8}" text-anchor="middle" font-size="26">${t().wheelCenter[0]}</text>
    <text class="wheel-center-t" x="${cx}" y="${cy+26}" text-anchor="middle" font-size="${S.lang==='ar'?26:18}">${t().wheelCenter[1]}</text>
  </svg></div>
  <p class="stage-caption">${t().sacredNote}${TODAY?` · ${t().todayLbl}: ${t().months[TODAY.m]} ${S.lang==='ar'?AR_NUM(TODAY.d):TODAY.d}`:''}</p>`;
}
function moonSVG(night){ // phase illustration across 30 nights
  const r=13;
  if(night>=13&&night<=15) return `<svg viewBox="0 0 30 30"><circle class="moon-face" cx="15" cy="15" r="${r}"/></svg>`;
  const p=night/30, k=Math.cos(p*2*Math.PI)*r, waxing=p<0.5;
  const outerSweep = waxing?1:0;                 // lit limb: right while waxing, left while waning
  const termSweep  = waxing ? (k>0?0:1) : (k>0?1:0); // terminator bulge
  return `<svg viewBox="0 0 30 30">
    <circle class="moon-dark" cx="15" cy="15" r="${r}"/>
    <path class="moon-face" d="M15 ${15-r} A ${r} ${r} 0 0 ${outerSweep} 15 ${15+r} A ${Math.abs(k).toFixed(2)} ${r} 0 0 ${termSweep} 15 ${15-r} Z"/>
  </svg>`;
}
function monthStrip(){
  let cells='';
  for(let n=1;n<=30;n++){
    const tnow = TODAY && TODAY.d===n;
    cells+=`<div class="moon-night ${n>=13&&n<=15?'white':''} ${tnow?'tnow':''}" title="${t().night} ${S.lang==='ar'?AR_NUM(n):n}">
      ${moonSVG(n)}<span class="n">${S.lang==='ar'?AR_NUM(n):n}</span>
      <span class="juz">${t().juzLbl}${S.lang==='ar'?AR_NUM(n):n}</span>
      ${tnow?`<span class="today-tag">${t().todayLbl}</span>`:''}</div>`;
  }
  return `<div class="moon-strip">${cells}</div><p class="stage-caption">${t().monthCaption} · ${S.lang==='ar'?'جزءٌ كل ليلةٍ يُتمّ الختمة':'a juzʾ each night completes the khatmah'}</p>`;
}
function weekRow(){
  const marks={1:'☽',4:'☽',5:'۞'};
  const heights={5:'h110',1:'h80',4:'h80'};
  let out='';
  for(let d=0;d<7;d++){
    const tnow = TODAY && TODAY.w===d;
    out+=`<div class="arch ${heights[d]||'h60'} ${d===5?'jumuah':''} ${(d===1||d===4)?'marked':''} ${tnow?'tnow':''}">
      <div class="mihrab"><span class="glyph">${marks[d]||'·'}</span></div>
      <div class="dname">${t().days[d]}${tnow?`<span class="today-tag">${t().todayLbl}</span>`:''}</div></div>`;
  }
  return `<div class="week-row">${out}</div><p class="stage-caption">${t().weekCaption}</p>`;
}
function dayArc(){
  const W=680,H=250,cx=W/2,cy=210,R=180;
  const stops=DAY_ORDER;
  let marks='';
  stops.forEach((k,i)=>{
    const a=Math.PI + (i/(stops.length-1))*Math.PI;
    const [x,y]=polar(cx,cy,R,a);
    const above = y < cy-40;
    marks+=`<g class="arc-stop" data-stop="${k}" role="button" tabindex="0">
      <circle cx="${x}" cy="${y}" r="7"/>
      <text x="${x}" y="${y + (above?-16:-16)}" text-anchor="middle">${t().dayStops[k]}</text></g>`;
  });
  const now=new Date(), hh=now.getHours()+now.getMinutes()/60;
  const frac=Math.min(1,Math.max(0,(hh-5)/16)); // 5:00 -> 21:00 across the arc
  const [sx,sy]=polar(cx,cy,R,Math.PI+frac*Math.PI);
  const isNightNow = hh<5||hh>19;
  return `<div class="day-arc-holder"><svg class="day-arc" viewBox="0 0 ${W} ${H+20}">
    <line class="horizon" x1="20" y1="${cy}" x2="${W-20}" y2="${cy}"/>
    <path class="arc-path" d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}"/>
    ${isNightNow
      ? `<circle class="arc-moon" cx="${sx}" cy="${sy}" r="8"/>`
      : `<circle class="arc-sun" cx="${sx}" cy="${sy}" r="9"/>`}
    <g class="wp-hub" role="button" tabindex="0" aria-label="${t().withPrayer}">
      <circle cx="${cx}" cy="${cy-58}" r="46"/>
      <text x="${cx}" y="${cy-64}" text-anchor="middle">۞</text>
      <text x="${cx}" y="${cy-44}" text-anchor="middle">${t().withPrayer}</text>
    </g>
    ${marks}</svg></div>
  <p class="stage-caption">${t().dayCaption}</p>`;
}

function occStar(){
  const W=560,H=330,cx=W/2,cy=H/2,R=118;
  // eight-pointed star (two rotated squares)
  const sq=(rot)=>{let p=[];for(let i=0;i<4;i++){const a=rot+i*Math.PI/2;p.push(polar(cx,cy,62,a).map(v=>v.toFixed(1)).join(' '));}return 'M'+p.join(' L')+' Z';};
  let nodes='';
  OCC_ORDER.forEach((k,i)=>{
    const a=-Math.PI/2 + i*(Math.PI*2/OCC_ORDER.length);
    const [x,y]=polar(cx,cy,R+16,a);
    const [lx,ly]=polar(cx,cy,R+16,a);
    nodes+=`<line class="occ-line" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>
      <g class="occ-node" data-occ="${k}" role="button" tabindex="0" aria-label="${t().occGroups[k]}">
      <circle cx="${x}" cy="${y}" r="30"/>
      <text class="oico" x="${x}" y="${y+6}" text-anchor="middle">${t().occIcons[k]}</text>
      <text class="olbl" x="${x}" y="${y+52}" text-anchor="middle">${t().occGroups[k]}</text></g>`;
  });
  return `<div class="occ-holder"><svg class="occ-star" viewBox="0 0 ${W} ${H+30}">
    <path class="occ-core occ-core-fill" d="${sq(0)}"/>
    <path class="occ-core" d="${sq(Math.PI/4)}"/>
    <text class="occ-glyph" x="${cx}" y="${cy+14}" text-anchor="middle">۞</text>
    ${nodes}</svg></div>
  <p class="stage-caption">${t().occCaption}</p>`;
}

/* ---------- cards ---------- */
function gradeLabel(g){ return t().grades[g] || t().grades.sahih; }
function cardHTML(e,idx){
  return `<article class="card" style="animation-delay:${Math.min(idx*60,420)}ms">
    <button class="card-head" aria-expanded="false">
      <span class="card-ico">${e.icon}</span>
      <span class="card-tt">
        <span class="ct">${S.lang==='ar'?e.tAr:e.tEn}${e.q?`<span class="qbadge">﴿﴾</span>`:''}</span><br>
        <span class="cb">${S.lang==='ar'?e.bAr:e.bEn}</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="card-body">
      <div class="card-inner">
        <p class="hadith-ar">${e.hAr}</p>
        <p class="hadith-en">${e.hEn}</p>
        <div class="meta-row">
          <span class="chip">${t().narrator}: ${S.lang==='ar'?e.nAr:e.nEn}</span>
          <span class="chip src">${S.lang==='ar'?e.srcAr:e.src}</span>
          <span class="chip grade">✓ ${gradeLabel(e.grade)}</span>
        </div>
        ${(S.lang==='ar'?e.noteAr:e.noteEn)?`<p class="gnote">${S.lang==='ar'?e.noteAr:e.noteEn}</p>`:''}
      </div>
    </div>
  </article>`;
}
function groupHTML(title, sub, entries, startIdx){
  return `<section class="group" ${sub?`id="g-${sub.replace(/\W/g,'')}"`:''}>
    <div class="group-h"><span class="rule"></span>
      <span class="gt"><span class="star8">۞</span>${title}<span class="star8">۞</span></span>
      <span class="rule"></span></div>
    <div class="cards">${entries.map((e,i)=>cardHTML(e,startIdx+i)).join('')}</div>
  </section>`;
}
function bindCards(){
  document.querySelectorAll('.card-head').forEach(h=>{
    h.onclick=()=>{
      const card=h.closest('.card'), body=card.querySelector('.card-body');
      const open=card.classList.toggle('open');
      h.setAttribute('aria-expanded',open);
      body.style.maxHeight = open ? body.scrollHeight+'px' : '0px';
    };
  });
}

/* ---------- level content ---------- */
function contentYear(){
  let html='',idx=0;
  const order=[0,7,8,9,11];
  const months = S.selMonth!==null ? [S.selMonth] : order;
  months.forEach(m=>{
    const es=E.filter(e=>e.level==='year'&&e.anchor===m);
    if(es.length){ html+=groupHTML(t().months[m],'m'+m,es,idx); idx+=es.length; }
  });
  if(S.selMonth!==null && !E.some(e=>e.level==='year'&&e.anchor===S.selMonth)){
    html=`<p class="level-intro">${S.lang==='ar'
      ?'ليس لهذا الشهر سُنَّةٌ مخصوصة ثابتة، ويبقى فيه عموم السُّنَن الشهرية واليومية.'
      :'No sunnah is specific to this month in the authentic record; the general monthly and daily sunan remain.'}</p>`;
  }
  return html;
}
function contentMonth(){
  const es=E.filter(e=>e.level==='month');
  return groupHTML(t().groupAllMonth,null,es,0);
}
function contentWeek(){
  let html='',idx=0;
  [1,4,5].forEach(d=>{
    const es=E.filter(e=>e.level==='week'&&e.anchor===d);
    if(es.length){ html+=groupHTML(t().days[d],'d'+d,es,idx); idx+=es.length; }
  });
  return html;
}
function contentDay(){
  let html='',idx=0;
  DAY_CONTENT.forEach(k=>{
    const es=E.filter(e=>e.level==='day'&&e.anchor===k);
    const title = k==='withPrayer' ? t().withPrayer : t().dayStops[k];
    if(es.length){ html+=`<div id="stop-${k}"></div>`+groupHTML(title,'s'+k,es,idx); idx+=es.length; }
  });
  return html;
}
function contentOcc(){
  let html='',idx=0;
  OCC_ORDER.forEach(k=>{
    const es=E.filter(e=>e.level==='occ'&&e.anchor===k);
    if(es.length){ html+=`<div id="occg-${k}"></div>`+groupHTML(t().occGroups[k],'o'+k,es,idx); idx+=es.length; }
  });
  return html;
}

/* ---------- render + zoom ---------- */
function stageHTML(){
  return {year:yearWheel, month:monthStrip, week:weekRow, day:dayArc, occ:occStar}[S.level]();
}
function contentHTML(){
  return {year:contentYear, month:contentMonth, week:contentWeek, day:contentDay, occ:contentOcc}[S.level]();
}
function paint(){
  $('#stage').innerHTML = stageHTML();
  $('#levelIntro').textContent = t().intro[S.level];
  $('#content').innerHTML = contentHTML();
  bindCards();
  document.querySelectorAll('.wheel-seg').forEach(g=>{
    const go=()=>{ S.selMonth = (S.selMonth===+g.dataset.m)?null:+g.dataset.m; paint(); };
    g.onclick=go; g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
  });
  document.querySelectorAll('.arc-stop').forEach(g=>{
    const go=()=>{ const el=$('#stop-'+g.dataset.stop); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); };
    g.onclick=go; g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
  });
  document.querySelectorAll('.wp-hub').forEach(g=>{
    const go=()=>{ const el=$('#stop-withPrayer'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); };
    g.onclick=go; g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
  });
  document.querySelectorAll('.occ-node').forEach(g=>{
    const go=()=>{ const el=$('#occg-'+g.dataset.occ); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); };
    g.onclick=go; g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
  });
}
function render(animate, zoomIn=true){
  const st=$('#stage');
  if(!animate){ paint(); return; }
  st.classList.add(zoomIn?'zooming-in':'zooming-out');
  setTimeout(()=>{ paint();
    st.classList.remove('zooming-in','zooming-out');
  }, 380);
}

/* ---------- starfield ---------- */
(function(){
  const cv=$('#stars'),ctx=cv.getContext('2d');
  let stars=[];
  function size(){ cv.width=innerWidth; cv.height=innerHeight;
    stars=Array.from({length:90},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
      r:Math.random()*1.3+0.2,p:Math.random()*Math.PI*2,s:0.004+Math.random()*0.01})); }
  function tick(){ ctx.clearRect(0,0,cv.width,cv.height);
    const gold=getComputedStyle(document.documentElement).getPropertyValue('--gold-bright').trim()||'#E8CB82';
    stars.forEach(st=>{ st.p+=st.s;
      ctx.globalAlpha=0.25+Math.abs(Math.sin(st.p))*0.55;
      ctx.fillStyle=gold; ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill(); });
    ctx.globalAlpha=1; requestAnimationFrame(tick); }
  addEventListener('resize',size); size();
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
})();

/* ---------- boot ---------- */
applyChrome(); renderNav(); paint();
</script>
</body>
