<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مَدَارَات السُّنَّة — Orbits of the Sunnah</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;500;700&family=Marcellus&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');

/* ============ TOKENS ============ */
:root{
  --gold:#C9A24B; --gold-bright:#E8CB82; --gold-deep:#8F6E2A;
  --radius:14px; --radius-lg:22px;
  --ar-display:'Scheherazade New','Amiri','Traditional Arabic',serif;
  --ar-body:'Amiri','Scheherazade New','Traditional Arabic',serif;
  --en-display:'Marcellus',Georgia,serif;
  --en-body:'Lora',Georgia,serif;
  --ease:cubic-bezier(.33,.9,.25,1);
}
html[data-theme="dark"]{
  --bg:#0A101F; --bg2:#0E1730; --surface:#131F3A; --surface2:#182747;
  --ink:#EFE7D2; --ink-dim:#9AA5BD; --ink-faint:#6B7690;
  --line:rgba(201,162,75,.20); --line-soft:rgba(201,162,75,.10);
  --green:#5A9A80; --shadow:0 18px 50px -18px rgba(0,0,0,.65);
  --glow:0 0 22px rgba(232,203,130,.35);
  --card-open:rgba(201,162,75,.05);
}
html[data-theme="light"]{
  --bg:#F5EFDF; --bg2:#EFE7D2; --surface:#FDFAF1; --surface2:#F6F0DF;
  --ink:#1D2A4C; --ink-dim:#54608A; --ink-faint:#8B93AE;
  --gold:#A87F2E; --gold-bright:#C9A24B; --gold-deep:#7A5B1E;
  --line:rgba(29,42,76,.18); --line-soft:rgba(29,42,76,.08);
  --green:#2F6B57; --shadow:0 16px 40px -20px rgba(29,42,76,.35);
  --glow:0 0 18px rgba(168,127,46,.30);
  --card-open:rgba(168,127,46,.05);
}

/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--ar-body); font-size:17px; line-height:1.85;
  min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(1200px 600px at 50% -10%, var(--bg2), transparent 70%),
    radial-gradient(900px 500px at 90% 110%, var(--bg2), transparent 60%);
  transition:background-color .5s var(--ease), color .5s var(--ease);
}
html[dir="ltr"] body{font-family:var(--en-body);font-size:16.5px;line-height:1.75}
::selection{background:var(--gold);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* faint star-field (dark only) */
#stars{position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0}
html[data-theme="light"] #stars{opacity:.12}

.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:0 20px 90px}

/* ============ HEADER ============ */
header.masthead{text-align:center;padding:44px 0 8px}
.ornament{color:var(--gold);font-size:26px;letter-spacing:.6em;user-select:none;
  text-shadow:var(--glow);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
h1.title-ar{font-family:var(--ar-display);font-weight:700;font-size:clamp(38px,7vw,62px);
  line-height:1.35;margin:6px 0 0;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.title-en{font-family:var(--en-display);letter-spacing:.32em;text-transform:uppercase;
  font-size:clamp(11px,2vw,14px);color:var(--ink-dim);margin-top:2px}
.tagline{color:var(--ink-dim);font-size:15.5px;max-width:640px;margin:14px auto 0}
html[dir="ltr"] .tagline{font-size:14.5px}

/* ============ TOP CONTROLS ============ */
.controls{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;
  align-items:center;gap:10px;padding:12px 2px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid var(--line-soft)}
.ctrl-group{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-dim);font-size:14px;
  background:var(--surface);transition:all .3s var(--ease)}
.pill:hover{color:var(--gold-bright);border-color:var(--gold);transform:translateY(-1px)}
.pill svg{width:16px;height:16px;flex:none}

/* ============ ORBIT NAV (signature) ============ */
nav.orbits{display:flex;justify-content:center;gap:clamp(8px,2.5vw,20px);margin:30px 0 6px;flex-wrap:wrap}
.orbit-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:14px 10px 12px;min-width:104px;border-radius:var(--radius-lg);
  border:1px solid transparent;color:var(--ink-dim);transition:all .35s var(--ease)}
.orbit-btn .rings{width:52px;height:52px}
.orbit-btn .rings circle{fill:none;stroke:currentColor;stroke-width:1.4;opacity:.35;
  transition:all .4s var(--ease)}
.orbit-btn .rings .active-ring{stroke:var(--gold);opacity:1;stroke-width:2.2;
  filter:drop-shadow(0 0 5px var(--gold))}
.orbit-btn .rings .core{fill:currentColor;stroke:none;opacity:.5}
.orbit-btn.on .rings .core{fill:var(--gold-bright);opacity:1;filter:drop-shadow(0 0 6px var(--gold))}
.orbit-btn .lbl{font-size:15.5px;font-weight:700;font-family:var(--ar-display)}
html[dir="ltr"] .orbit-btn .lbl{font-family:var(--en-display);font-weight:400;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase}
.orbit-btn .sub{font-size:11.5px;color:var(--ink-faint);margin-top:-6px;letter-spacing:.05em}
.orbit-btn.on{color:var(--ink);border-color:var(--line);background:var(--surface);
  box-shadow:var(--shadow)}
.orbit-btn:hover{color:var(--ink)}

/* ============ STAGE (the visual per level) ============ */
#stage{position:relative;margin:22px auto 8px;min-height:120px;
  transition:opacity .38s var(--ease), transform .45s var(--ease), filter .38s var(--ease)}
#stage.zooming-in{opacity:0;transform:scale(.86);filter:blur(6px)}
#stage.zooming-out{opacity:0;transform:scale(1.12);filter:blur(6px)}
.stage-caption{text-align:center;color:var(--ink-faint);font-size:13.5px;margin-top:8px}

/* year wheel */
.wheel-holder{display:flex;justify-content:center}
svg.year-wheel{width:min(92vw,460px);height:auto;overflow:visible}
.wheel-seg{cursor:pointer;transition:all .35s var(--ease)}
.wheel-seg path.arc{fill:var(--surface);stroke:var(--line);stroke-width:1;transition:all .35s var(--ease)}
.wheel-seg:hover path.arc{fill:var(--surface2)}
.wheel-seg.has-sunan path.arc{fill:color-mix(in srgb, var(--gold) 14%, var(--surface))}
.wheel-seg.sel path.arc{fill:color-mix(in srgb, var(--gold) 32%, var(--surface));
  stroke:var(--gold);stroke-width:1.6;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--gold) 55%,transparent))}
.wheel-seg text{fill:var(--ink-dim);font-size:13px;font-family:var(--ar-display);pointer-events:none;
  transition:fill .3s}
html[dir="ltr"] .wheel-seg text{font-family:var(--en-display);font-size:9.5px;letter-spacing:.05em}
.wheel-seg.sel text,.wheel-seg:hover text{fill:var(--ink)}
.wheel-seg.has-sunan .dot{fill:var(--gold-bright)}
.wheel-center-t{fill:var(--gold);font-family:var(--ar-display);font-weight:700}
html[dir="ltr"] .wheel-center-t{font-family:var(--en-display);font-weight:400}
.wheel-center-s{fill:var(--ink-faint);font-size:10px;letter-spacing:.2em}
.sacred-mark{fill:none;stroke:var(--green);stroke-width:1.1;opacity:.85}

/* month strip: 30 moons */
.moon-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:10px;
  max-width:820px;margin:0 auto;padding:10px 4px}
.moon-night{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;
  border-radius:12px;border:1px solid transparent;transition:all .3s var(--ease)}
.moon-night svg{width:30px;height:30px}
.moon-night .n{font-size:12px;color:var(--ink-faint)}
.moon-night.white{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);
  box-shadow:var(--glow)}
.moon-night.white .n{color:var(--gold-bright);font-weight:700}
.moon-face{fill:var(--gold-bright)}
.moon-dark{fill:var(--surface2);stroke:var(--line);stroke-width:.8}

/* week arches */
.week-row{display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,1.6vw,14px);
  flex-wrap:wrap;padding:8px 0 2px}
.arch{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 2px;
  transition:transform .3s var(--ease)}
.arch:hover{transform:translateY(-4px)}
.arch .mihrab{width:clamp(52px,10vw,86px);border:1.4px solid var(--line);border-bottom:none;
  background:var(--surface);border-radius:100px 100px 0 0;display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:10px;position:relative;transition:all .35s var(--ease)}
.arch .mihrab .glyph{font-size:20px;line-height:1;color:var(--ink-faint)}
.arch.h60 .mihrab{height:74px}
.arch.h80 .mihrab{height:96px}
.arch.h110 .mihrab{height:128px}
.arch.marked .mihrab{border-color:var(--gold);
  background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.arch.marked .glyph{color:var(--gold-bright)}
.arch.jumuah .mihrab{border-color:var(--gold);border-width:2px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));
  box-shadow:var(--glow)}
.arch .dname{font-size:14.5px;font-weight:700;font-family:var(--ar-display);color:var(--ink-dim)}
html[dir="ltr"] .arch .dname{font-family:var(--en-display);font-weight:400;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase}
.arch.jumuah .dname{color:var(--gold-bright)}

/* day arc */
.day-arc-holder{display:flex;justify-content:center}
svg.day-arc{width:min(94vw,680px);height:auto;overflow:visible}
.arc-path{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}
.arc-sun{fill:var(--gold-bright);filter:drop-shadow(0 0 8px var(--gold))}
.arc-stop circle{fill:var(--surface);stroke:var(--gold);stroke-width:1.5;cursor:pointer;
  transition:all .3s var(--ease)}
.arc-stop:hover circle{fill:var(--gold);}
.arc-stop text{fill:var(--ink-dim);font-size:12px;font-family:var(--ar-display)}
html[dir="ltr"] .arc-stop text{font-family:var(--en-body);font-size:9.5px}
.horizon{stroke:var(--line);stroke-width:1}

/* ============ SECTIONS & CARDS ============ */
.level-intro{max-width:720px;margin:26px auto 4px;text-align:center;color:var(--ink-dim);
  font-size:15.5px}
.group-h{display:flex;align-items:center;gap:14px;margin:40px 0 16px}
.group-h .rule{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.group-h .gt{font-family:var(--ar-display);font-weight:700;font-size:24px;color:var(--gold);
  display:flex;align-items:center;gap:10px;white-space:nowrap}
html[dir="ltr"] .group-h .gt{font-family:var(--en-display);font-weight:400;font-size:19px;letter-spacing:.06em}
.group-h .gt .star8{color:var(--gold);font-size:17px;opacity:.9}
.group-h .gsub{font-size:12.5px;color:var(--ink-faint);letter-spacing:.08em;white-space:nowrap}

.cards{display:grid;gap:14px;margin-top:14px}
.card{border:1px solid var(--line-soft);border-radius:var(--radius-lg);background:var(--surface);
  overflow:hidden;transition:border-color .35s var(--ease), box-shadow .35s var(--ease),
  background .35s var(--ease);
  animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--line)}
.card.open{border-color:var(--gold);box-shadow:var(--shadow);background:
  linear-gradient(180deg,var(--card-open),transparent 120px),var(--surface)}
.card-head{width:100%;display:flex;align-items:center;gap:16px;padding:18px 20px;text-align:start}
.card-ico{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:21px;
  background:var(--surface2);color:var(--gold-bright);transition:all .35s var(--ease)}
.card.open .card-ico{border-color:var(--gold);box-shadow:var(--glow)}
.card-tt{flex:1;min-width:0}
.card-tt .ct{font-family:var(--ar-display);font-weight:700;font-size:20px;line-height:1.5}
html[dir="ltr"] .card-tt .ct{font-family:var(--en-display);font-weight:400;font-size:17.5px}
.card-tt .cb{color:var(--ink-dim);font-size:14.5px;line-height:1.7;margin-top:2px}
html[dir="ltr"] .card-tt .cb{font-size:13.5px}
.chev{flex:none;width:22px;height:22px;color:var(--ink-faint);transition:transform .4s var(--ease)}
.card.open .chev{transform:rotate(180deg);color:var(--gold)}
.card-body{max-height:0;overflow:hidden;transition:max-height .55s var(--ease)}
.card-inner{padding:4px 22px 22px;border-top:1px dashed var(--line-soft);margin:0 20px;
  padding-left:2px;padding-right:2px}
.hadith-ar{font-family:var(--ar-body);font-size:21px;line-height:2.15;text-align:right;
  direction:rtl;color:var(--ink);padding:14px 18px 10px;position:relative}
.hadith-ar::before{content:'﴾';color:var(--gold);opacity:.0}
.hadith-en{font-family:var(--en-body);font-style:italic;font-size:15px;line-height:1.8;
  color:var(--ink-dim);padding:2px 18px 12px;direction:ltr;text-align:left}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;
  border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);
  font-family:var(--en-body)}
html[dir="rtl"] .chip{font-family:var(--ar-body);font-size:13.5px}
.chip.grade{border-color:color-mix(in srgb,var(--green) 55%,transparent);color:var(--green);font-weight:600}
.chip.src{border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold)}
.note{font-size:13px;color:var(--ink-faint);padding:8px 16px 0;line-height:1.7}

/* quran badge + grading note */
.qbadge{display:inline-flex;align-items:center;font-size:13px;color:var(--gold);
  border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:6px;
  padding:0 6px;margin-inline-start:8px;vertical-align:middle;line-height:1.6;
  font-family:var(--ar-display)}
.gnote{font-size:13px;color:var(--ink-faint);padding:6px 16px 0;line-height:1.8;font-style:normal}
html[dir="ltr"] .gnote{font-family:var(--en-body);font-size:12.5px}

/* today indicators */
.wheel-seg.tnow path.arc{stroke:var(--green);stroke-width:2;stroke-dasharray:4 3}
.wheel-seg.tnow text{fill:var(--green);font-weight:700}
.moon-night.tnow{border-color:var(--green);box-shadow:0 0 14px color-mix(in srgb,var(--green) 45%,transparent)}
.moon-night.tnow .n{color:var(--green);font-weight:700}
.moon-night .juz{font-size:10px;color:var(--ink-faint);letter-spacing:.03em;line-height:1}
.arch.tnow .dname{color:var(--green)}
.arch.tnow .mihrab{border-color:var(--green)}
.today-tag{display:block;font-size:10px;color:var(--green);letter-spacing:.08em;line-height:1.2}

/* occasions star */
.occ-holder{display:flex;justify-content:center}
svg.occ-star{width:min(94vw,560px);height:auto;overflow:visible}
.occ-core{fill:none;stroke:var(--gold);stroke-width:1.3;opacity:.9}
.occ-core-fill{fill:color-mix(in srgb,var(--gold) 10%,transparent)}
.occ-glyph{fill:var(--gold);font-family:var(--ar-display);font-size:40px}
.occ-node{cursor:pointer}
.occ-node circle{fill:var(--surface);stroke:var(--line);stroke-width:1.3;transition:all .3s var(--ease)}
.occ-node:hover circle{stroke:var(--gold);fill:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.occ-node text.oico{font-size:19px}
.occ-node text.olbl{fill:var(--ink-dim);font-size:13.5px;font-family:var(--ar-display);font-weight:700}
html[dir="ltr"] .occ-node text.olbl{font-family:var(--en-display);font-weight:400;font-size:10.5px;letter-spacing:.06em}
.occ-node:hover text.olbl{fill:var(--ink)}
.occ-line{stroke:var(--line-soft);stroke-width:1;stroke-dasharray:2 5}

/* with-every-prayer hub on day arc */
.wp-hub{cursor:pointer}
.wp-hub circle{fill:color-mix(in srgb,var(--gold) 14%,var(--surface));stroke:var(--gold);
  stroke-width:1.6;transition:all .3s var(--ease)}
.wp-hub:hover circle{fill:var(--gold)}
.wp-hub:hover text{fill:var(--bg)}
.wp-hub text{fill:var(--gold-bright);font-size:13px;font-family:var(--ar-display);font-weight:700}
html[dir="ltr"] .wp-hub text{font-family:var(--en-display);font-weight:400;font-size:9.5px;letter-spacing:.05em}
.arc-moon{fill:var(--ink-dim);opacity:.8}

/* footer */
footer{margin-top:70px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:2}
footer .ornament{font-size:18px}
.salla{font-family:var(--ar-display);color:var(--gold);font-size:22px}

@media (max-width:560px){
  .card-head{padding:15px 14px;gap:12px}
  .card-ico{width:40px;height:40px;font-size:18px}
  .hadith-ar{font-size:19px;padding:12px 8px 8px}
  .hadith-en{padding:2px 8px 10px}
  .orbit-btn{min-width:78px;padding:10px 6px}
  .orbit-btn .rings{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">

  <div class="controls">
    <div class="ctrl-group">
      <button class="pill" id="langBtn" aria-label="Switch language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.6 4 5.6 4 9s-1.2 6.4-4 9c-2.8-2.6-4-5.6-4-9s1.2-6.4 4-9z"/></svg>
        <span id="langLbl">English</span>
      </button>
    </div>
    <div class="ctrl-group">
      <button class="pill" id="themeBtn" aria-label="Toggle dark or light mode">
        <svg id="themeIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <span id="themeLbl">فاتح</span>
      </button>
    </div>
  </div>

  <header class="masthead">
    <div class="ornament">۞ ۞ ۞</div>
    <h1 class="title-ar" id="appTitle">مَدَارَات السُّنَّة</h1>
    <div class="title-en" id="appSubtitle">Orbits of the Sunnah</div>
    <p class="tagline" id="tagline"></p>
  </header>

  <nav class="orbits" id="orbitNav" aria-label="Time levels"></nav>

  <div id="stage" aria-live="polite"></div>
  <p class="level-intro" id="levelIntro"></p>

  <main id="content"></main>

  <footer>
    <div class="ornament">۞</div>
    <p id="footNote"></p>
    <p class="salla">صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ تَسْلِيمًا كَثِيرًا</p>
  </footer>
</div>
<script>
/* ==================== I18N ==================== */
const L = {
ar:{
  langBtn:'English', theme:{dark:'فاتح', light:'داكن'},
  title:'مَدَارَات السُّنَّة', subtitle:'Orbits of the Sunnah',
  tagline:'موسوعة تفاعلية لسُنَن النبي ﷺ الثابتة في الصحيح، مرتّبة على مدارات الزمن: السنة، فالشهر، فالأسبوع، فاليوم.',
  levels:{year:'السَّنَة', month:'الشَّهْر', week:'الأُسْبُوع', day:'اليَوْم', occ:'المَوَاقِف'},
  levelSub:{year:'١٢ شهرًا', month:'٣٠ ليلة', week:'٧ أيام', day:'٢٤ ساعة', occ:'سُنن الأحداث'},
  intro:{

 bAr:'وصية النبي ﷺ لأبي هريرة، وهي كصيام الدهر كله.',
 bEn:'The Prophet\u2019s ﷺ counsel to Abu Hurayrah — it equals fasting a whole lifetime.',
 hAr:'قال أبو هريرة رضي الله عنه: «أَوْصَانِي خَلِيلِي ﷺ بِثَلَاثٍ: صِيَامِ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ، وَرَكْعَتَيِ الضُّحَى، وَأَنْ أُوتِرَ قَبْلَ أَنْ أَنَامَ». وقال ﷺ: «صَوْمُ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ صَوْمُ الدَّهْرِ كُلِّهِ».',
 hEn:'Abu Hurayrah said: "My beloved friend ﷺ advised me with three things: fasting three days of every month, the two rakʿahs of Duha, and to pray Witr before I sleep." And he ﷺ said: "Fasting three days of every month is (like) fasting the entire lifetime."',
 nAr:'أبو هريرة وعبد الله بن عمرو رضي الله عنهم',nEn:'Abu Hurayrah & ʿAbdullah ibn ʿAmr (may Allah be pleased with them)',
 src:'Sahih al-Bukhari 1178 · 1979',srcAr:'صحيح البخاري ١١٧٨ · ١٩٧٩',grade:'sahih'},
{level:'month',anchor:13,icon:'🌕',
 tAr:'الأيام البيض: ١٣ و١٤ و١٥',tEn:'The White Days: 13th, 14th & 15th',
 bAr:'أفضل مواضع الثلاث: ليالي اكتمال البدر.',
 bEn:'The preferred placement of the three: the nights of the full moon.',
 hAr:'قال رسول الله ﷺ لأبي ذر: «إِذَا صُمْتَ مِنَ الشَّهْرِ ثَلَاثًا فَصُمْ ثَلَاثَ عَشْرَةَ وَأَرْبَعَ عَشْرَةَ وَخَمْسَ عَشْرَةَ». وبوَّب البخاري: باب صيام أيام البيض.',
 hEn:'The Messenger of Allah ﷺ said to Abu Dharr: "If you fast three days of the month, then fast the thirteenth, the fourteenth, and the fifteenth." Imam al-Bukhari titled a chapter of his Sahih: "Fasting the White Days."',
 nAr:'أبو ذر الغفاري رضي الله عنه',nEn:'Abu Dharr al-Ghifari (may Allah be pleased with him)',
 src:'Jamiʿ al-Tirmidhi 761 — graded Sahih by al-Albani',srcAr:'جامع الترمذي ٧٦١ — صححه الألباني',grade:'sahih_albani'},
{level:'month',anchor:1,icon:'🌒',
 tAr:'الدعاء عند رؤية الهلال',tEn:'Supplication on sighting the new crescent',
 bAr:'استقبال كل شهرٍ هجري بدعاء الأمن والإيمان.',
 bEn:'Greeting each Hijri month with a prayer for security and faith.',
 hAr:'كان النبي ﷺ إذا رأى الهلال قال: «اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالأَمْنِ وَالإِيمَانِ، وَالسَّلَامَةِ وَالإِسْلَامِ، رَبِّي وَرَبُّكَ اللهُ».',
 hEn:'When the Prophet ﷺ saw the new crescent he would say: "O Allah, bring it over us with security and faith, with safety and Islam. My Lord and your Lord is Allah."',
 nAr:'طلحة بن عبيد الله رضي الله عنه',nEn:'Talhah ibn ʿUbaydillah (may Allah be pleased with him)',
 src:'Jamiʿ al-Tirmidhi 3451 — graded Sahih by al-Albani',srcAr:'جامع الترمذي ٣٤٥١ — صححه الألباني',grade:'sahih_albani'},

/* ---------- WEEK ---------- */
{level:'week',anchor:5,icon:'💧',
 tAr:'غُسل يوم الجمعة',tEn:'The Friday bath (Ghusl)',
 bAr:'من آكد سنن الجمعة لمن يشهدها.',
 bEn:'Among the most emphasized Friday sunan for whoever attends it.',
 hAr:'قال رسول الله ﷺ: «إِذَا جَاءَ أَحَدُكُمُ الجُمُعَةَ فَلْيَغْتَسِلْ».',
 hEn:'The Messenger of Allah ﷺ said: "When any of you comes to Friday (prayer), let him take a bath."',
 nAr:'عبد الله بن عمر رضي الله عنهما',nEn:'ʿAbdullah ibn ʿUmar (may Allah be pleased with them both)',
 src:'Sahih al-Bukhari 877 · Sahih Muslim 844',srcAr:'صحيح البخاري ٨٧٧ · صحيح مسلم ٨٤٤',grade:'muttafaq'},
{level:'week',anchor:5,icon:'🚶',
 tAr:'التبكير إلى الجمعة',tEn:'Going early to Jumuʿah',
 bAr:'الرائح في الساعة الأولى كمن قرَّب بَدَنة.',
 bEn:'Whoever goes in the first hour is like one offering a camel in charity.',
 hAr:'قال رسول الله ﷺ: «مَنِ اغْتَسَلَ يَوْمَ الجُمُعَةِ غُسْلَ الجَنَابَةِ ثُمَّ رَاحَ فَكَأَنَّمَا قَرَّبَ بَدَنَةً، وَمَنْ رَاحَ فِي السَّاعَةِ الثَّانِيَةِ فَكَأَنَّمَا قَرَّبَ بَقَرَةً...».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever bathes on Friday like the bath of janabah, then goes (in the first hour), it is as if he offered a camel; whoever goes in the second hour, it is as if he offered a cow..."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 881 · Sahih Muslim 850',srcAr:'صحيح البخاري ٨٨١ · صحيح مسلم ٨٥٠',grade:'muttafaq'},
{level:'week',anchor:5,icon:'📖',
 tAr:'قراءة سورة الكهف',tEn:'Reciting Surat al-Kahf',
 bAr:'نورٌ لقارئها ما بين الجمعتين.',
 bEn:'A light for its reciter between the two Fridays.',
 hAr:'قال النبي ﷺ: «مَنْ قَرَأَ سُورَةَ الكَهْفِ فِي يَوْمِ الجُمُعَةِ أَضَاءَ لَهُ مِنَ النُّورِ مَا بَيْنَ الجُمُعَتَيْنِ».',
 hEn:'The Prophet ﷺ said: "Whoever recites Surat al-Kahf on Friday, a light will shine for him between the two Fridays."',
 nAr:'أبو سعيد الخدري رضي الله عنه',nEn:'Abu Saʿid al-Khudri (may Allah be pleased with him)',
 src:'al-Sunan al-Kubra (al-Bayhaqi) 5996 — graded Sahih by al-Albani (Sahih al-Jamiʿ 6470)',
 srcAr:'السنن الكبرى للبيهقي ٥٩٩٦ — صححه الألباني (صحيح الجامع ٦٤٧٠)',grade:'sahih_albani'},
{level:'week',anchor:5,icon:'🕊',
 tAr:'الإكثار من الصلاة على النبي ﷺ',tEn:'Abundant salawat upon the Prophet ﷺ',
 bAr:'صلاتكم معروضةٌ عليه ﷺ يوم الجمعة.',
 bEn:'Your salawat are presented to him ﷺ on Friday.',
 hAr:'قال رسول الله ﷺ: «إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الجُمُعَةِ... فَأَكْثِرُوا عَلَيَّ مِنَ الصَّلَاةِ فِيهِ، فَإِنَّ صَلَاتَكُمْ مَعْرُوضَةٌ عَلَيَّ».',
 hEn:'The Messenger of Allah ﷺ said: "Among the best of your days is Friday... so send abundant blessings upon me in it, for your blessings are presented to me."',
 nAr:'أوس بن أوس رضي الله عنه',nEn:'Aws ibn Aws (may Allah be pleased with him)',
 src:'Sunan Abi Dawud 1047 — graded Sahih by al-Albani',srcAr:'سنن أبي داود ١٠٤٧ — صححه الألباني',grade:'sahih_albani'},
{level:'week',anchor:5,icon:'⏳',
 tAr:'تحرّي ساعة الإجابة',tEn:'Seeking the hour of answered duʿa',
 bAr:'في الجمعة ساعةٌ لا يسأل الله فيها عبدٌ شيئًا إلا أعطاه.',
 bEn:'On Friday there is an hour in which no servant asks Allah anything except that He grants it.',
 hAr:'ذكر النبي ﷺ يوم الجمعة فقال: «فِيهِ سَاعَةٌ لَا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ وَهُوَ قَائِمٌ يُصَلِّي يَسْأَلُ اللهَ تَعَالَى شَيْئًا إِلَّا أَعْطَاهُ إِيَّاهُ» — وَأَشَارَ بِيَدِهِ يُقَلِّلُهَا. وفي رواية: «فَالْتَمِسُوهَا آخِرَ سَاعَةٍ بَعْدَ العَصْرِ».',
 hEn:'The Prophet ﷺ mentioned Friday and said: "In it is an hour which no Muslim servant encounters while standing in prayer, asking Allah for something, except that He gives it to him" — and he gestured with his hand to show how brief it is. In another narration: "So seek it in the last hour after ʿAsr."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 935 · Sahih Muslim 852 · Abu Dawud 1048 (Sahih, al-Albani)',srcAr:'صحيح البخاري ٩٣٥ · صحيح مسلم ٨٥٢ · أبو داود ١٠٤٨ (صححه الألباني)',grade:'muttafaq'},
{level:'week',anchor:1,icon:'🌤',
 tAr:'صيام يوم الاثنين',tEn:'Fasting on Monday',
 bAr:'يوم مولده ﷺ ويوم بُعث — أو أُنزل عليه فيه.',
 bEn:'The day he ﷺ was born, and the day of his mission — or when revelation began.',
 hAr:'سُئل رسول الله ﷺ عن صوم يوم الاثنين فقال: «ذَاكَ يَوْمٌ وُلِدْتُ فِيهِ، وَيَوْمٌ بُعِثْتُ — أَوْ أُنْزِلَ عَلَيَّ فِيهِ».',
 hEn:'The Messenger of Allah ﷺ was asked about fasting on Monday, and he said: "That is the day on which I was born, and the day I was sent — or on which revelation came down to me."',
 nAr:'أبو قتادة رضي الله عنه',nEn:'Abu Qatadah (may Allah be pleased with him)',
 src:'Sahih Muslim 1162',srcAr:'صحيح مسلم ١١٦٢',grade:'sahih'},
{level:'week',anchor:4,icon:'🚪',
 tAr:'الاثنين والخميس: عرض الأعمال',tEn:'Monday & Thursday: deeds presented',
 bAr:'تُفتح أبواب الجنة فيهما، ويُغفر لكل عبدٍ لا يشرك بالله.',
 bEn:'The gates of Paradise are opened, and every servant who associates nothing with Allah is forgiven.',
 hAr:'قال رسول الله ﷺ: «تُفْتَحُ أَبْوَابُ الجَنَّةِ يَوْمَ الِاثْنَيْنِ وَيَوْمَ الخَمِيسِ، فَيُغْفَرُ لِكُلِّ عَبْدٍ لَا يُشْرِكُ بِاللهِ شَيْئًا، إِلَّا رَجُلًا كَانَتْ بَيْنَهُ وَبَيْنَ أَخِيهِ شَحْنَاءُ».',
 hEn:'The Messenger of Allah ﷺ said: "The gates of Paradise are opened on Monday and Thursday, and every servant who associates nothing with Allah is forgiven — except a man between whom and his brother there is rancour."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih Muslim 2565',srcAr:'صحيح مسلم ٢٥٦٥',grade:'sahih'},
/* ---------- DAY ---------- */
{level:'day',anchor:'wake',icon:'🌅',
 tAr:'ذِكر الاستيقاظ',tEn:'The waking remembrance',
 bAr:'أول كلام اليوم: حمدُ الذي أحيانا بعد ما أماتنا.',
 bEn:'The first words of the day: praise of the One who gave us life after death (of sleep).',
 hAr:'كان النبي ﷺ إذا استيقظ قال: «الحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ».',
 hEn:'When the Prophet ﷺ awoke he would say: "All praise is for Allah who gave us life after having caused us to die, and to Him is the resurrection."',
 nAr:'حذيفة بن اليمان رضي الله عنه',nEn:'Hudhayfah ibn al-Yaman (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 6312',srcAr:'صحيح البخاري ٦٣١٢',grade:'sahih'},
{level:'day',anchor:'wake',icon:'🪥',
 tAr:'السِّواك عند القيام',tEn:'The siwak upon rising',
 bAr:'كان ﷺ يستاك إذا قام من نومه.',
 bEn:'He ﷺ would clean his mouth with the siwak whenever he rose from sleep.',
 hAr:'قال حذيفة رضي الله عنه: «كَانَ النَّبِيُّ ﷺ إِذَا قَامَ مِنَ اللَّيْلِ يَشُوصُ فَاهُ بِالسِّوَاكِ». وقال ﷺ: «لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ مَعَ كُلِّ صَلَاةٍ».',
 hEn:'Hudhayfah said: "When the Prophet ﷺ got up at night, he would scrub his mouth with the siwak." And he ﷺ said: "Were it not that I would burden my Ummah, I would have commanded them to use the siwak with every prayer."',
 nAr:'حذيفة وأبو هريرة رضي الله عنهما',nEn:'Hudhayfah & Abu Hurayrah (may Allah be pleased with them)',
 src:'Sahih al-Bukhari 245 · 887',srcAr:'صحيح البخاري ٢٤٥ · ٨٨٧',grade:'sahih'},
{level:'day',anchor:'fajr',icon:'🌄',
 tAr:'ركعتا الفجر',tEn:'The two rakʿahs before Fajr',
 bAr:'خيرٌ من الدنيا وما فيها.',
 bEn:'Better than the world and all it contains.',
 hAr:'قال رسول الله ﷺ: «رَكْعَتَا الفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا».',
 hEn:'The Messenger of Allah ﷺ said: "The two rakʿahs of Fajr are better than the world and everything in it."',
 nAr:'عائشة رضي الله عنها',nEn:'ʿAʾishah (may Allah be pleased with her)',
 src:'Sahih Muslim 725',srcAr:'صحيح مسلم ٧٢٥',grade:'sahih'},
{level:'day',anchor:'fajr',icon:'🤍',
 tAr:'سيّد الاستغفار (صباحًا ومساءً)',tEn:'The Master of Seeking Forgiveness (morning & evening)',
 bAr:'من قاله موقنًا به فمات في يومه أو ليلته فهو من أهل الجنة.',
 bEn:'Whoever says it with certainty and dies that day or night is among the people of Paradise.',
 hAr:'«اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي؛ فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ».',
 hEn:'"O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as much as I am able. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me, and I acknowledge my sin — so forgive me, for none forgives sins but You."',
 nAr:'شداد بن أوس رضي الله عنه',nEn:'Shaddad ibn Aws (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 6306',srcAr:'صحيح البخاري ٦٣٠٦',grade:'sahih'},
{level:'day',anchor:'duha',icon:'☀️',
 tAr:'صلاة الضحى',tEn:'The Duha prayer',
 bAr:'ركعتان تجزئان عن صدقةٍ على كل مفصلٍ من مفاصلك.',
 bEn:'Two rakʿahs suffice as charity for every joint of your body.',
 hAr:'قال رسول الله ﷺ: «يُصْبِحُ عَلَى كُلِّ سُلَامَى مِنْ أَحَدِكُمْ صَدَقَةٌ... وَيُجْزِئُ مِنْ ذَلِكَ رَكْعَتَانِ يَرْكَعُهُمَا مِنَ الضُّحَى».',
 hEn:'The Messenger of Allah ﷺ said: "Each morning, charity is due upon every joint of your body... and two rakʿahs which one prays in the forenoon suffice for all of that."',
 nAr:'أبو ذر رضي الله عنه',nEn:'Abu Dharr (may Allah be pleased with him)',
 src:'Sahih Muslim 720',srcAr:'صحيح مسلم ٧٢٠',grade:'sahih'},
{level:'day',anchor:'dhuhr',icon:'🏠',
 tAr:'السنن الرواتب: اثنتا عشرة ركعة',tEn:'The twelve routine (Rawatib) rakʿahs',
 bAr:'من حافظ عليها كل يوم بُني له بيتٌ في الجنة.',
 bEn:'Whoever keeps them daily, a house is built for him in Paradise.',
 hAr:'قال رسول الله ﷺ: «مَا مِنْ عَبْدٍ مُسْلِمٍ يُصَلِّي لِلَّهِ كُلَّ يَوْمٍ ثِنْتَيْ عَشْرَةَ رَكْعَةً تَطَوُّعًا غَيْرَ فَرِيضَةٍ، إِلَّا بَنَى اللهُ لَهُ بَيْتًا فِي الجَنَّةِ». وهي: أربعٌ قبل الظهر وثنتان بعدها، وثنتان بعد المغرب، وثنتان بعد العشاء، وثنتان قبل الفجر.',
 hEn:'The Messenger of Allah ﷺ said: "No Muslim servant prays for Allah twelve voluntary rakʿahs every day, besides the obligatory, except that Allah builds for him a house in Paradise." They are: four before Dhuhr and two after, two after Maghrib, two after ʿIsha, and two before Fajr.',
 nAr:'أم حبيبة رضي الله عنها',nEn:'Umm Habibah (may Allah be pleased with her)',
 src:'Sahih Muslim 728',srcAr:'صحيح مسلم ٧٢٨',grade:'sahih'},
{level:'day',anchor:'dhuhr',icon:'🍞',
 tAr:'سُنن الطعام',tEn:'Sunan of eating',
 bAr:'التسمية، والأكل باليمين، ومما يليك.',
 bEn:'Saying Bismillah, eating with the right hand, and from what is nearest to you.',
 hAr:'قال رسول الله ﷺ لعمر بن أبي سلمة: «يَا غُلَامُ، سَمِّ اللهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ».',
 hEn:'The Messenger of Allah ﷺ said to ʿUmar ibn Abi Salamah: "O young man, say the name of Allah, eat with your right hand, and eat from what is directly in front of you."',
 nAr:'عمر بن أبي سلمة رضي الله عنهما',nEn:'ʿUmar ibn Abi Salamah (may Allah be pleased with them)',
 src:'Sahih al-Bukhari 5376 · Sahih Muslim 2022',srcAr:'صحيح البخاري ٥٣٧٦ · صحيح مسلم ٢٠٢٢',grade:'muttafaq'},
{level:'day',anchor:'asr',icon:'📿',
 tAr:'مائة تسبيحة في اليوم',tEn:'One hundred tasbihat a day',
 bAr:'«سبحان الله وبحمده» مائة مرة تحطُّ الخطايا ولو كانت مثل زبد البحر.',
 bEn:'"SubhanAllahi wa bihamdih" a hundred times erases sins even if they are like the foam of the sea.',
 hAr:'قال رسول الله ﷺ: «مَنْ قَالَ: سُبْحَانَ اللهِ وَبِحَمْدِهِ، فِي يَوْمٍ مِائَةَ مَرَّةٍ، حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever says: Glory be to Allah and praise be to Him, one hundred times in a day, his sins are erased even if they were like the foam of the sea."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 6405 · Sahih Muslim 2691',srcAr:'صحيح البخاري ٦٤٠٥ · صحيح مسلم ٢٦٩١',grade:'muttafaq'},
{level:'day',anchor:'isha',icon:'🛡',
 tAr:'آية الكرسي عند النوم',tEn:'Ayat al-Kursi before sleep',
 bAr:'لا يزال عليك من الله حافظ، ولا يقربك شيطانٌ حتى تصبح.',
 bEn:'A guardian from Allah remains over you, and no devil approaches you until morning.',
 hAr:'قال النبي ﷺ مصدِّقًا لما أُخبر به أبو هريرة: «إِذَا أَوَيْتَ إِلَى فِرَاشِكَ فَاقْرَأْ آيَةَ الكُرْسِيِّ، لَنْ يَزَالَ عَلَيْكَ مِنَ اللهِ حَافِظٌ، وَلَا يَقْرَبُكَ شَيْطَانٌ حَتَّى تُصْبِحَ» — وقال ﷺ: «صَدَقَكَ وَهُوَ كَذُوبٌ».',
 hEn:'The Prophet ﷺ confirmed what Abu Hurayrah was told: "When you retire to your bed, recite Ayat al-Kursi; a guardian from Allah will remain over you, and no devil will approach you until morning." He ﷺ said: "He told you the truth, though he is a great liar."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 2311',srcAr:'صحيح البخاري ٢٣١١',grade:'sahih'},
{level:'day',anchor:'night',icon:'🌌',
 tAr:'قيام الليل',tEn:'The night prayer (Qiyam al-Layl)',
 bAr:'أفضل الصلاة بعد الفريضة.',
 bEn:'The best prayer after the obligatory prayers.',
 hAr:'قال رسول الله ﷺ: «أَفْضَلُ الصَّلَاةِ بَعْدَ الفَرِيضَةِ صَلَاةُ اللَّيْلِ».',
 hEn:'The Messenger of Allah ﷺ said: "The best prayer after the obligatory prayer is the night prayer."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih Muslim 1163',srcAr:'صحيح مسلم ١١٦٣',grade:'sahih'},
{level:'day',anchor:'night',icon:'🕯',
 tAr:'الوِتر خاتمة الليل',tEn:'Witr, the seal of the night',
 bAr:'اجعلوا آخر صلاتكم بالليل وترًا.',
 bEn:'Make the last of your night prayer odd (Witr).',
 hAr:'قال رسول الله ﷺ: «اجْعَلُوا آخِرَ صَلَاتِكُمْ بِاللَّيْلِ وِتْرًا».',
 hEn:'The Messenger of Allah ﷺ said: "Make the last of your prayer at night Witr (an odd number)."',
 nAr:'عبد الله بن عمر رضي الله عنهما',nEn:'ʿAbdullah ibn ʿUmar (may Allah be pleased with them both)',
 src:'Sahih al-Bukhari 998 · Sahih Muslim 751',srcAr:'صحيح البخاري ٩٩٨ · صحيح مسلم ٧٥١',grade:'muttafaq'},
{level:'day',anchor:'sleep',icon:'🛏',
 tAr:'الوضوء والنوم على الشقّ الأيمن',tEn:'Wudu and sleeping on the right side',
 bAr:'هدي النبي ﷺ عند إتيان المضجع، مع دعاء تسليم النفس.',
 bEn:'The Prophetic way when going to bed, with the duʿa of surrendering oneself to Allah.',
 hAr:'قال رسول الله ﷺ: «إِذَا أَتَيْتَ مَضْجَعَكَ فَتَوَضَّأْ وُضُوءَكَ لِلصَّلَاةِ، ثُمَّ اضْطَجِعْ عَلَى شِقِّكَ الأَيْمَنِ، ثُمَّ قُلْ: اللَّهُمَّ أَسْلَمْتُ وَجْهِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ... وَاجْعَلْهُنَّ آخِرَ مَا تَقُولُ».',
 hEn:'The Messenger of Allah ﷺ said: "When you come to your bed, perform wudu as you would for prayer, then lie on your right side and say: O Allah, I submit my face to You and entrust my affair to You... and make these the last words you speak."',
 nAr:'البراء بن عازب رضي الله عنهما',nEn:'al-Baraʾ ibn ʿAzib (may Allah be pleased with them)',
 src:'Sahih al-Bukhari 247 · Sahih Muslim 2710',srcAr:'صحيح البخاري ٢٤٧ · صحيح مسلم ٢٧١٠',grade:'muttafaq'},
{level:'day',anchor:'sleep',icon:'🌠',
 tAr:'دعاء النوم',tEn:'The sleeping duʿa',
 bAr:'«باسمك اللهم أموت وأحيا».',
 bEn:'"In Your name, O Allah, I die and I live."',
 hAr:'كان النبي ﷺ إذا أراد أن ينام قال: «بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا».',
 hEn:'When the Prophet ﷺ intended to sleep he would say: "In Your name, O Allah, I die and I live."',
 nAr:'حذيفة بن اليمان رضي الله عنه',nEn:'Hudhayfah ibn al-Yaman (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 6324',srcAr:'صحيح البخاري ٦٣٢٤',grade:'sahih'},
/* ---------- YEAR (additions) ---------- */
{level:'year',anchor:8,icon:'🎁',q:true,
 tAr:'الجود ومدارسة القرآن في رمضان',tEn:'Generosity & Qurʾan review in Ramadan',
 bAr:'كان ﷺ أجود ما يكون في رمضان حين يدارسه جبريل القرآن.',
 bEn:'He ﷺ was at his most generous in Ramadan, when Jibril reviewed the Qurʾan with him.',
 hAr:'قال ابن عباس رضي الله عنهما: «كَانَ رَسُولُ اللهِ ﷺ أَجْوَدَ النَّاسِ، وَكَانَ أَجْوَدُ مَا يَكُونُ فِي رَمَضَانَ حِينَ يَلْقَاهُ جِبْرِيلُ، وَكَانَ يَلْقَاهُ فِي كُلِّ لَيْلَةٍ مِنْ رَمَضَانَ فَيُدَارِسُهُ القُرْآنَ».',
 hEn:'Ibn ʿAbbas said: "The Messenger of Allah ﷺ was the most generous of people, and he was at his most generous in Ramadan when Jibril met him; and Jibril would meet him every night of Ramadan to review the Qurʾan with him."',
 nAr:'عبد الله بن عباس رضي الله عنهما',nEn:'ʿAbdullah ibn ʿAbbas (may Allah be pleased with them both)',
 src:'Sahih al-Bukhari 6 · Sahih Muslim 2308',srcAr:'صحيح البخاري ٦ · صحيح مسلم ٢٣٠٨',grade:'muttafaq'},
{level:'year',anchor:8,icon:'🍲',
 tAr:'تفطير الصائمين',tEn:'Feeding those who fast',
 bAr:'لمن فطَّر صائمًا مثلُ أجره من غير أن ينقص من أجر الصائم شيء.',
 bEn:'Whoever gives a fasting person their iftar earns the same reward, without lessening theirs.',
 hAr:'قال رسول الله ﷺ: «مَنْ فَطَّرَ صَائِمًا كَانَ لَهُ مِثْلُ أَجْرِهِ، غَيْرَ أَنَّهُ لَا يَنْقُصُ مِنْ أَجْرِ الصَّائِمِ شَيْءٌ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever provides a fasting person with food to break the fast will have a reward like his, without the fasting person\u2019s reward being diminished at all."',
 nAr:'زيد بن خالد الجهني رضي الله عنه',nEn:'Zayd ibn Khalid al-Juhani (may Allah be pleased with him)',
 src:'Jamiʿ al-Tirmidhi 807 — graded Sahih by al-Albani',srcAr:'جامع الترمذي ٨٠٧ — صححه الألباني',grade:'sahih_albani'},
{level:'year',anchor:9,icon:'🕌',q:true,
 tAr:'قراءة صلاة العيدين',tEn:'Recitation in the two Eid prayers',
 bAr:'بقاف واقتربت الساعة، أو بالأعلى والغاشية.',
 bEn:'With Qaf and al-Qamar, or with al-Aʿla and al-Ghashiyah.',
 hAr:'كان رسول الله ﷺ يقرأ في الأضحى والفطر بـ«ق وَالقُرْآنِ المَجِيدِ» و«اقْتَرَبَتِ السَّاعَةُ وَانْشَقَّ القَمَرُ». وعن النعمان بن بشير: كان يقرأ في العيدين وفي الجمعة بـ«سَبِّحِ اسْمَ رَبِّكَ الأَعْلَى» و«هَلْ أَتَاكَ حَدِيثُ الغَاشِيَةِ»، وإذا اجتمع العيد والجمعة في يوم واحد قرأ بهما في الصلاتين.',
 hEn:'The Messenger of Allah ﷺ would recite in the Eid prayers Surat Qaf and Surat al-Qamar. And Nuʿman ibn Bashir reported that he recited al-Aʿla and al-Ghashiyah in the two Eids and in Jumuʿah; and when Eid and Friday coincided, he recited them in both prayers.',
 nAr:'أبو واقد الليثي والنعمان بن بشير رضي الله عنهما',nEn:'Abu Waqid al-Laythi & al-Nuʿman ibn Bashir (may Allah be pleased with them)',
 src:'Sahih Muslim 891 · 878',srcAr:'صحيح مسلم ٨٩١ · ٨٧٨',grade:'sahih'},
{level:'year',anchor:11,icon:'🔊',
 tAr:'التكبير في أيام العشر',tEn:'Takbir throughout the ten days',
 bAr:'كان ابن عمر وأبو هريرة يكبِّران في الأسواق فيكبِّر الناس بتكبيرهما.',
 bEn:'Ibn ʿUmar and Abu Hurayrah would proclaim the takbir in the markets, and the people would join them.',
 hAr:'ذكر البخاري: «وَكَانَ ابْنُ عُمَرَ وَأَبُو هُرَيْرَةَ يَخْرُجَانِ إِلَى السُّوقِ فِي أَيَّامِ العَشْرِ يُكَبِّرَانِ وَيُكَبِّرُ النَّاسُ بِتَكْبِيرِهِمَا». الله أكبر، الله أكبر، لا إله إلا الله، والله أكبر، الله أكبر ولله الحمد.',
 hEn:'Al-Bukhari recorded: "Ibn ʿUmar and Abu Hurayrah used to go out to the marketplace in the (first) ten days (of Dhul-Hijjah) saying the takbir, and the people would say it because of theirs." Allahu akbar, Allahu akbar, la ilaha illa Allah; wallahu akbar, Allahu akbar, wa lillahil-hamd.',
 nAr:'ابن عمر وأبو هريرة رضي الله عنهم',nEn:'Ibn ʿUmar & Abu Hurayrah (may Allah be pleased with them)',
 src:'Sahih al-Bukhari (muʿallaq, before 969)',srcAr:'صحيح البخاري (معلقًا قبل ٩٦٩)',grade:'athar'},
{level:'year',anchor:11,icon:'🍖',
 tAr:'يوم الأضحى: الأكل بعد الصلاة',tEn:'Eid al-Adha: eating after the prayer',
 bAr:'كان ﷺ يأكل قبل صلاة الفطر ولا يأكل يوم الأضحى حتى يصلي.',
 bEn:'He ﷺ ate before the Eid al-Fitr prayer, and on al-Adha he would not eat until after praying.',
 hAr:'قال بريدة رضي الله عنه: «كَانَ النَّبِيُّ ﷺ لَا يَخْرُجُ يَوْمَ الفِطْرِ حَتَّى يَطْعَمَ، وَلَا يَطْعَمُ يَوْمَ الأَضْحَى حَتَّى يُصَلِّيَ».',
 hEn:'Buraydah (may Allah be pleased with him) said: "The Prophet ﷺ would not go out on the day of al-Fitr until he had eaten, and he would not eat on the day of al-Adha until he had prayed."',
 nAr:'بريدة بن الحصيب رضي الله عنه',nEn:'Buraydah ibn al-Husayb (may Allah be pleased with him)',
 src:'Jamiʿ al-Tirmidhi 542 — graded Sahih by al-Albani',srcAr:'جامع الترمذي ٥٤٢ — صححه الألباني',grade:'sahih_albani'},

{level:'month',anchor:'all',icon:'📖',q:true,
 tAr:'ختمة القرآن كل شهر: جزءٌ كل ليلة',tEn:'A Qurʾan khatmah every month: a juzʾ a night',
 bAr:'أمرٌ نبوي لعبد الله بن عمرو، ولمن وجد قوةً: ختمةٌ في سبع.',
 bEn:'A Prophetic instruction to ʿAbdullah ibn ʿAmr; and for the strong, a khatmah in seven.',
 hAr:'قال رسول الله ﷺ لعبد الله بن عمرو: «اقْرَإِ القُرْآنَ فِي شَهْرٍ». قُلْتُ: إِنِّي أَجِدُ قُوَّةً، حَتَّى قَالَ: «فَاقْرَأْهُ فِي سَبْعٍ وَلَا تَزِدْ عَلَى ذَلِكَ». فقراءة جزءٍ كل ليلة تُتِمُّ الختمة مع اكتمال الشهر.',
 hEn:'The Messenger of Allah ﷺ said to ʿAbdullah ibn ʿAmr: "Recite the Qurʾan in a month." I said: I find strength in me, until he said: "Then recite it in seven, and do not go beyond that." A juzʾ each night completes the khatmah as the month completes.',
 nAr:'عبد الله بن عمرو بن العاص رضي الله عنهما',nEn:'ʿAbdullah ibn ʿAmr ibn al-ʿAs (may Allah be pleased with them both)',
 src:'Sahih al-Bukhari 5054 · Sahih Muslim 1159',srcAr:'صحيح البخاري ٥٠٥٤ · صحيح مسلم ١١٥٩',grade:'muttafaq'},

/* ---------- WEEK (additions) ---------- */
{level:'week',anchor:5,icon:'🌿',
 tAr:'الطِّيب وأحسن الثياب',tEn:'Perfume and one\u2019s finest for Jumuʿah',
 bAr:'غُسلٌ وطُهرٌ ودُهنٌ وطِيب، ثم إنصاتٌ للخطبة: غفرانٌ إلى الجمعة الأخرى.',
 bEn:'Bathing, oiling, perfume, then attentive silence: forgiveness until the next Friday.',
 hAr:'قال رسول الله ﷺ: «لَا يَغْتَسِلُ رَجُلٌ يَوْمَ الجُمُعَةِ، وَيَتَطَهَّرُ مَا اسْتَطَاعَ مِنْ طُهْرٍ، وَيَدَّهِنُ مِنْ دُهْنِهِ، أَوْ يَمَسُّ مِنْ طِيبِ بَيْتِهِ، ثُمَّ يَخْرُجُ فَلَا يُفَرِّقُ بَيْنَ اثْنَيْنِ، ثُمَّ يُصَلِّي مَا كُتِبَ لَهُ، ثُمَّ يُنْصِتُ إِذَا تَكَلَّمَ الإِمَامُ، إِلَّا غُفِرَ لَهُ مَا بَيْنَهُ وَبَيْنَ الجُمُعَةِ الأُخْرَى».',
 hEn:'The Messenger of Allah ﷺ said: "No man bathes on Friday, purifies himself as much as he can, applies his oil or touches some of the perfume of his house, then goes out without separating two people, prays what is written for him, then keeps silent when the imam speaks, except that he is forgiven what is between it and the next Friday."',
 nAr:'سلمان الفارسي رضي الله عنه',nEn:'Salman al-Farisi (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 883',srcAr:'صحيح البخاري ٨٨٣',grade:'sahih'},
{level:'week',anchor:5,icon:'🕮',q:true,
 tAr:'فجر الجمعة: السجدة والإنسان',tEn:'Friday Fajr: al-Sajdah & al-Insan',
 bAr:'كان ﷺ يقرأ بهما في صلاة فجر يوم الجمعة.',
 bEn:'He ﷺ would recite them in the Fajr prayer of Friday.',
 hAr:'قال أبو هريرة رضي الله عنه: «كَانَ النَّبِيُّ ﷺ يَقْرَأُ فِي الجُمُعَةِ فِي صَلَاةِ الفَجْرِ: الم تَنْزِيلُ (السَّجْدَةَ)، وَهَلْ أَتَى عَلَى الإِنْسَانِ».',
 hEn:'Abu Hurayrah said: "On Friday, the Prophet ﷺ would recite in the Fajr prayer: Alif-Lam-Mim Tanzil (al-Sajdah) and Hal ata ʿala al-insan (al-Insan)."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 891 · Sahih Muslim 880',srcAr:'صحيح البخاري ٨٩١ · صحيح مسلم ٨٨٠',grade:'muttafaq'},
{level:'week',anchor:5,icon:'🎙',q:true,
 tAr:'قراءة صلاة الجمعة',tEn:'Recitation in the Jumuʿah prayer',
 bAr:'بالجمعة والمنافقين، أو بالأعلى والغاشية.',
 bEn:'With al-Jumuʿah and al-Munafiqun, or al-Aʿla and al-Ghashiyah.',
 hAr:'كان رسول الله ﷺ يقرأ في صلاة الجمعة بسورة الجمعة والمنافقين. وعن النعمان بن بشير: كان يقرأ فيها بـ«سَبِّحِ اسْمَ رَبِّكَ الأَعْلَى» و«هَلْ أَتَاكَ حَدِيثُ الغَاشِيَةِ».',
 hEn:'The Messenger of Allah ﷺ would recite in the Jumuʿah prayer Surat al-Jumuʿah and al-Munafiqun; and al-Nuʿman ibn Bashir reported that he recited in it al-Aʿla and al-Ghashiyah.',
 nAr:'ابن عباس والنعمان بن بشير رضي الله عنهم',nEn:'Ibn ʿAbbas & al-Nuʿman ibn Bashir (may Allah be pleased with them)',
 src:'Sahih Muslim 879 · 878',srcAr:'صحيح مسلم ٨٧٩ · ٨٧٨',grade:'sahih'},
{level:'week',anchor:5,icon:'👣',
 tAr:'المشي والدنوّ من الإمام والإنصات',tEn:'Walking, sitting near the imam, and listening',
 bAr:'بكل خطوةٍ أجر سنةٍ صيامها وقيامها لمن مشى وأنصت ولم يلغُ.',
 bEn:'For every step, the reward of a year\u2019s fasting and prayer, for one who walks, listens, and avoids idle talk.',
 hAr:'قال رسول الله ﷺ: «مَنْ غَسَّلَ يَوْمَ الجُمُعَةِ وَاغْتَسَلَ، ثُمَّ بَكَّرَ وَابْتَكَرَ، وَمَشَى وَلَمْ يَرْكَبْ، وَدَنَا مِنَ الإِمَامِ فَاسْتَمَعَ وَلَمْ يَلْغُ، كَانَ لَهُ بِكُلِّ خُطْوَةٍ عَمَلُ سَنَةٍ، أَجْرُ صِيَامِهَا وَقِيَامِهَا». وقال ﷺ: «إِذَا قُلْتَ لِصَاحِبِكَ أَنْصِتْ يَوْمَ الجُمُعَةِ وَالإِمَامُ يَخْطُبُ فَقَدْ لَغَوْتَ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever bathes on Friday, goes early, walks and does not ride, sits close to the imam, listens, and does not engage in idle talk, will have for every step the reward of a year of its fasting and its prayer." And he ﷺ said: "If you say to your companion, Be quiet, on Friday while the imam is delivering the khutbah, you have engaged in idle talk."',
 nAr:'أوس بن أوس وأبو هريرة رضي الله عنهما',nEn:'Aws ibn Aws & Abu Hurayrah (may Allah be pleased with them)',
 src:'Abu Dawud 345 (Sahih, al-Albani) · Sahih al-Bukhari 934',srcAr:'أبو داود ٣٤٥ (صححه الألباني) · صحيح البخاري ٩٣٤',grade:'sahih_albani'},
{level:'week',anchor:5,icon:'🛡',
 tAr:'عدم إفراد الجمعة بالصيام',tEn:'Not singling out Friday for fasting',
 bAr:'سنّة حمايةٍ ليوم العيد الأسبوعي: لا يُفرد بصومٍ إلا بيومٍ قبله أو بعده.',
 bEn:'A protective sunnah for the weekly festival: Friday is not fasted alone.',
 hAr:'قال رسول الله ﷺ: «لَا يَصُومَنَّ أَحَدُكُمْ يَوْمَ الجُمُعَةِ، إِلَّا يَوْمًا قَبْلَهُ أَوْ بَعْدَهُ».',
 hEn:'The Messenger of Allah ﷺ said: "None of you should fast on Friday, unless (he fasts) a day before it or after it."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 1985 · Sahih Muslim 1144',srcAr:'صحيح البخاري ١٩٨٥ · صحيح مسلم ١١٤٤',grade:'muttafaq'},

{level:'day',anchor:'withPrayer',icon:'🕌',
 tAr:'إجابة المؤذّن ودعاء الوسيلة',tEn:'Answering the muʾadhdhin & the Wasilah duʿa',
 bAr:'ترديدٌ، ثم صلاةٌ على النبي ﷺ، ثم سؤالُ الوسيلة له.',
 bEn:'Repeat the words, send salawat upon him ﷺ, then ask Allah to grant him al-Wasilah.',
 hAr:'قال رسول الله ﷺ: «إِذَا سَمِعْتُمُ المُؤَذِّنَ فَقُولُوا مِثْلَ مَا يَقُولُ، ثُمَّ صَلُّوا عَلَيَّ... ثُمَّ سَلُوا اللهَ لِيَ الوَسِيلَةَ». وقال ﷺ: «مَنْ قَالَ حِينَ يَسْمَعُ النِّدَاءَ: اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ القَائِمَةِ، آتِ مُحَمَّدًا الوَسِيلَةَ وَالفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ؛ حَلَّتْ لَهُ شَفَاعَتِي يَوْمَ القِيَامَةِ».',
 hEn:'The Messenger of Allah ﷺ said: "When you hear the muʾadhdhin, say as he says, then send blessings upon me... then ask Allah to grant me al-Wasilah." And he ﷺ said: "Whoever says upon hearing the call: O Allah, Lord of this perfect call and the established prayer, grant Muhammad al-Wasilah and eminence, and raise him to the praised station You promised him; my intercession will be his on the Day of Resurrection."',
 nAr:'عبد الله بن عمرو وجابر رضي الله عنهم',nEn:'ʿAbdullah ibn ʿAmr & Jabir (may Allah be pleased with them)',
 src:'Sahih Muslim 384 · Sahih al-Bukhari 614',srcAr:'صحيح مسلم ٣٨٤ · صحيح البخاري ٦١٤',grade:'sahih'},
{level:'day',anchor:'withPrayer',icon:'⏱',
 tAr:'الدعاء بين الأذان والإقامة',tEn:'Duʿa between the adhan and iqamah',
 bAr:'موطنُ إجابةٍ لا يُرَدُّ فيه الدعاء.',
 bEn:'A window in which supplication is not turned away.',
 hAr:'قال رسول الله ﷺ: «الدُّعَاءُ لَا يُرَدُّ بَيْنَ الأَذَانِ وَالإِقَامَةِ».',
 hEn:'The Messenger of Allah ﷺ said: "Supplication between the adhan and the iqamah is not rejected."',
 nAr:'أنس بن مالك رضي الله عنه',nEn:'Anas ibn Malik (may Allah be pleased with him)',
 src:'Abu Dawud 521 · al-Tirmidhi 212 — graded Sahih by al-Albani',srcAr:'أبو داود ٥٢١ · الترمذي ٢١٢ — صححه الألباني',grade:'sahih_albani'},
{level:'day',anchor:'withPrayer',icon:'💧',
 tAr:'دعاء ما بعد الوضوء',tEn:'The duʿa after wudu',
 bAr:'تُفتح له أبواب الجنة الثمانية يدخل من أيّها شاء.',
 bEn:'The eight gates of Paradise are opened for him to enter by whichever he wills.',
 hAr:'قال رسول الله ﷺ: «مَا مِنْكُمْ مِنْ أَحَدٍ يَتَوَضَّأُ فَيُسْبِغُ الوُضُوءَ، ثُمَّ يَقُولُ: أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّدًا عَبْدُ اللهِ وَرَسُولُهُ، إِلَّا فُتِحَتْ لَهُ أَبْوَابُ الجَنَّةِ الثَّمَانِيَةُ يَدْخُلُ مِنْ أَيِّهَا شَاءَ».',
 hEn:'The Messenger of Allah ﷺ said: "There is none of you who performs wudu, completing it well, then says: I bear witness that there is no god but Allah and that Muhammad is the servant of Allah and His Messenger, except that the eight gates of Paradise are opened for him, to enter by whichever he wills."',
 nAr:'عمر بن الخطاب رضي الله عنه',nEn:'ʿUmar ibn al-Khattab (may Allah be pleased with him)',
 src:'Sahih Muslim 234',srcAr:'صحيح مسلم ٢٣٤',grade:'sahih'},
{level:'day',anchor:'withPrayer',icon:'👞',
 tAr:'ركعتان بعد كل وضوء',tEn:'Two rakʿahs after every wudu',
 bAr:'أرجى عمل بلالٍ الذي سمع النبي ﷺ دفَّ نعليه في الجنة.',
 bEn:'The most hopeful deed of Bilal, whose footsteps the Prophet ﷺ heard in Paradise.',
 hAr:'قال النبي ﷺ لبلال: «يَا بِلَالُ، حَدِّثْنِي بِأَرْجَى عَمَلٍ عَمِلْتَهُ فِي الإِسْلَامِ، فَإِنِّي سَمِعْتُ دَفَّ نَعْلَيْكَ بَيْنَ يَدَيَّ فِي الجَنَّةِ». قَالَ: مَا عَمِلْتُ عَمَلًا أَرْجَى عِنْدِي أَنِّي لَمْ أَتَطَهَّرْ طَهُورًا فِي سَاعَةِ لَيْلٍ أَوْ نَهَارٍ إِلَّا صَلَّيْتُ بِذَلِكَ الطُّهُورِ مَا كُتِبَ لِي أَنْ أُصَلِّيَ.',
 hEn:'The Prophet ﷺ said to Bilal: "O Bilal, tell me of the most hopeful deed you have done in Islam, for I heard the sound of your sandals ahead of me in Paradise." He said: I have done nothing more hopeful to me than that I never purified myself at any hour of night or day except that I prayed with that purification what was written for me to pray.',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 1149 · Sahih Muslim 2458',srcAr:'صحيح البخاري ١١٤٩ · صحيح مسلم ٢٤٥٨',grade:'muttafaq'},
{level:'day',anchor:'withPrayer',icon:'🚶',
 tAr:'كثرة الخُطا وانتظار الصلاة',tEn:'Many steps to the mosque & awaiting prayer',
 bAr:'ممحاةُ الخطايا ورافعةُ الدرجات: فذلكم الرباط.',
 bEn:'The eraser of sins and raiser of ranks: that is the ribat.',
 hAr:'قال رسول الله ﷺ: «أَلَا أَدُلُّكُمْ عَلَى مَا يَمْحُو اللهُ بِهِ الخَطَايَا وَيَرْفَعُ بِهِ الدَّرَجَاتِ؟ إِسْبَاغُ الوُضُوءِ عَلَى المَكَارِهِ، وَكَثْرَةُ الخُطَا إِلَى المَسَاجِدِ، وَانْتِظَارُ الصَّلَاةِ بَعْدَ الصَّلَاةِ، فَذَلِكُمُ الرِّبَاطُ».',
 hEn:'The Messenger of Allah ﷺ said: "Shall I not direct you to that by which Allah erases sins and raises ranks? Performing wudu thoroughly despite difficulty, taking many steps to the mosques, and waiting for prayer after prayer: that is the ribat."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih Muslim 251',srcAr:'صحيح مسلم ٢٥١',grade:'sahih'},
{level:'day',anchor:'withPrayer',icon:'🚪',
 tAr:'دعاء دخول المسجد والخروج منه',tEn:'Entering and leaving the mosque',
 bAr:'«اللهم افتح لي أبواب رحمتك» دخولًا، و«من فضلك» خروجًا.',
 bEn:'"Open for me the gates of Your mercy" entering, and "of Your bounty" leaving.',
 hAr:'قال رسول الله ﷺ: «إِذَا دَخَلَ أَحَدُكُمُ المَسْجِدَ فَلْيَقُلْ: اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ، وَإِذَا خَرَجَ فَلْيَقُلْ: اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ».',
 hEn:'The Messenger of Allah ﷺ said: "When one of you enters the mosque, let him say: O Allah, open for me the gates of Your mercy; and when he leaves, let him say: O Allah, I ask You of Your bounty."',
 nAr:'أبو حميد أو أبو أسيد رضي الله عنهما',nEn:'Abu Humayd or Abu Usayd (may Allah be pleased with them)',
 src:'Sahih Muslim 713',srcAr:'صحيح مسلم ٧١٣',grade:'sahih'},
{level:'day',anchor:'withPrayer',icon:'📿',
 tAr:'التسبيح دُبُر كل صلاة',tEn:'Tasbih after every prayer',
 bAr:'٣٣ تسبيحة و٣٣ تحميدة و٣٣ تكبيرة وتمام المائة بالتهليل: غفرانٌ ولو كانت مثل زبد البحر.',
 bEn:'33 tasbih, 33 tahmid, 33 takbir, completing 100 with tahlil: forgiveness even like the foam of the sea.',
 hAr:'قال رسول الله ﷺ: «مَنْ سَبَّحَ اللهَ فِي دُبُرِ كُلِّ صَلَاةٍ ثَلَاثًا وَثَلَاثِينَ، وَحَمِدَ اللهَ ثَلَاثًا وَثَلَاثِينَ، وَكَبَّرَ اللهَ ثَلَاثًا وَثَلَاثِينَ، فَتِلْكَ تِسْعَةٌ وَتِسْعُونَ، وَقَالَ تَمَامَ المِائَةِ: لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ؛ غُفِرَتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever glorifies Allah 33 times after every prayer, praises Allah 33 times, and magnifies Allah 33 times, that is ninety-nine; and completes the hundred with: There is no god but Allah alone without partner, His is the dominion and His is the praise, and He is over all things able; his sins are forgiven even if they were like the foam of the sea."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih Muslim 597',srcAr:'صحيح مسلم ٥٩٧',grade:'sahih'},
{level:'day',anchor:'withPrayer',icon:'🛡',q:true,
 tAr:'آية الكرسي دُبُر كل صلاة',tEn:'Ayat al-Kursi after every prayer',
 bAr:'لم يمنعه من دخول الجنة إلا أن يموت.',
 bEn:'Nothing stands between him and Paradise except death.',
 hAr:'قال رسول الله ﷺ: «مَنْ قَرَأَ آيَةَ الكُرْسِيِّ دُبُرَ كُلِّ صَلَاةٍ مَكْتُوبَةٍ لَمْ يَمْنَعْهُ مِنْ دُخُولِ الجَنَّةِ إِلَّا أَنْ يَمُوتَ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever recites Ayat al-Kursi after every obligatory prayer, nothing prevents him from entering Paradise except death."',
 nAr:'أبو أمامة الباهلي رضي الله عنه',nEn:'Abu Umamah al-Bahili (may Allah be pleased with him)',
 src:'al-Nasaʾi (al-Kubra 9928) — graded Sahih by al-Albani (al-Silsilah 972)',srcAr:'النسائي (الكبرى ٩٩٢٨) — صححه الألباني (الصحيحة ٩٧٢)',grade:'sahih_albani'},
{level:'day',anchor:'withPrayer',icon:'🕮',q:true,
 tAr:'المعوِّذات دُبُر كل صلاة',tEn:'The Muʿawwidhat after every prayer',
 bAr:'أوصى بها النبي ﷺ عقبة بن عامر عقب كل صلاة.',
 bEn:'The Prophet ﷺ instructed ʿUqbah ibn ʿAmir to recite them after every prayer.',
 hAr:'قال عقبة بن عامر رضي الله عنه: «أَمَرَنِي رَسُولُ اللهِ ﷺ أَنْ أَقْرَأَ بِالمُعَوِّذَاتِ دُبُرَ كُلِّ صَلَاةٍ».',
 hEn:'ʿUqbah ibn ʿAmir said: "The Messenger of Allah ﷺ commanded me to recite the Muʿawwidhat after every prayer."',
 nAr:'عقبة بن عامر رضي الله عنه',nEn:'ʿUqbah ibn ʿAmir (may Allah be pleased with him)',
 src:'Abu Dawud 1523 — graded Sahih by al-Albani',srcAr:'أبو داود ١٥٢٣ — صححه الألباني',grade:'sahih_albani'},
{level:'day',anchor:'withPrayer',icon:'🤲',
 tAr:'اللهم أعنّي على ذكرك وشكرك',tEn:'"O Allah, help me remember You"',
 bAr:'وصية النبي ﷺ لمعاذٍ مقرونةً بقوله: والله إني لأحبك.',
 bEn:'His ﷺ counsel to Muʿadh, joined to the words: By Allah, I love you.',
 hAr:'قال رسول الله ﷺ لمعاذ: «يَا مُعَاذُ، وَاللهِ إِنِّي لَأُحِبُّكَ... أُوصِيكَ يَا مُعَاذُ لَا تَدَعَنَّ فِي دُبُرِ كُلِّ صَلَاةٍ تَقُولُ: اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ».',
 hEn:'The Messenger of Allah ﷺ said to Muʿadh: "O Muʿadh, by Allah I love you... I advise you, O Muʿadh: never leave saying after every prayer: O Allah, help me to remember You, to thank You, and to worship You well."',
 nAr:'معاذ بن جبل رضي الله عنه',nEn:'Muʿadh ibn Jabal (may Allah be pleased with him)',
 src:'Abu Dawud 1522 — graded Sahih by al-Albani',srcAr:'أبو داود ١٥٢٢ — صححه الألباني',grade:'sahih_albani'},

{level:'day',anchor:'wake',icon:'🚻',
 tAr:'دعاء دخول الخلاء',tEn:'Entering the washroom',
 bAr:'«اللهم إني أعوذ بك من الخُبث والخبائث».',
 bEn:'"O Allah, I seek refuge in You from the male and female devils."',
 hAr:'كان النبي ﷺ إذا دخل الخلاء قال: «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الخُبُثِ وَالخَبَائِثِ».',
 hEn:'When the Prophet ﷺ entered the washroom he would say: "O Allah, I seek refuge in You from the wicked male and female devils."',
 nAr:'أنس بن مالك رضي الله عنه',nEn:'Anas ibn Malik (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 142 · Sahih Muslim 375',srcAr:'صحيح البخاري ١٤٢ · صحيح مسلم ٣٧٥',grade:'muttafaq'},
{level:'day',anchor:'fajr',icon:'🕮',q:true,
 tAr:'قراءة سنّتي الفجر والمغرب',tEn:'Recitation in the Fajr & Maghrib sunnahs',
 bAr:'الكافرون في الأولى والإخلاص في الثانية: رآه ابن عمر عشرين مرة.',
 bEn:'Al-Kafirun in the first and al-Ikhlas in the second; Ibn ʿUmar watched him do it twenty times.',
 hAr:'قرأ النبي ﷺ في ركعتي الفجر: «قُلْ يَا أَيُّهَا الكَافِرُونَ» و«قُلْ هُوَ اللهُ أَحَدٌ». وقال ابن عمر: رَمَقْتُ النَّبِيَّ ﷺ عِشْرِينَ مَرَّةً يَقْرَأُ فِي الرَّكْعَتَيْنِ بَعْدَ المَغْرِبِ وَفِي الرَّكْعَتَيْنِ قَبْلَ الفَجْرِ بِهِمَا.',
 hEn:'The Prophet ﷺ recited in the two rakʿahs of Fajr: "Say, O disbelievers" and "Say, He is Allah, One." And Ibn ʿUmar said: I watched the Prophet ﷺ twenty times reciting them in the two rakʿahs after Maghrib and the two before Fajr.',
 nAr:'أبو هريرة وابن عمر رضي الله عنهم',nEn:'Abu Hurayrah & Ibn ʿUmar (may Allah be pleased with them)',
 src:'Sahih Muslim 726 · al-Nasaʾi 992 (Sahih, al-Albani: al-Silsilah 3328)',srcAr:'صحيح مسلم ٧٢٦ · النسائي ٩٩٢ (صححه الألباني: الصحيحة ٣٣٢٨)',grade:'sahih'},
{level:'day',anchor:'fajr',icon:'🕮',q:true,
 tAr:'المعوِّذات ثلاثًا صباحًا ومساءً',tEn:'The three Quls, thrice, morning and evening',
 bAr:'الإخلاص والفلق والناس ثلاث مرات: تكفيك من كل شيء.',
 bEn:'Al-Ikhlas, al-Falaq and al-Nas three times: they suffice you against everything.',
 hAr:'قال رسول الله ﷺ: «قُلْ هُوَ اللهُ أَحَدٌ وَالمُعَوِّذَتَيْنِ حِينَ تُمْسِي وَحِينَ تُصْبِحُ، ثَلَاثَ مَرَّاتٍ، تَكْفِيكَ مِنْ كُلِّ شَيْءٍ».',
 hEn:'The Messenger of Allah ﷺ said: "Say: He is Allah, One, and the two surahs of refuge, when you reach evening and when you reach morning, three times: they will suffice you against everything."',
 nAr:'عبد الله بن خبيب رضي الله عنه',nEn:'ʿAbdullah ibn Khubayb (may Allah be pleased with him)',
 src:'Abu Dawud 5082 · al-Tirmidhi 3575 — graded Sahih by al-Albani',srcAr:'أبو داود ٥٠٨٢ · الترمذي ٣٥٧٥ — صححه الألباني',grade:'sahih_albani'},
{level:'day',anchor:'dhuhr',icon:'🥛',
 tAr:'التنفّس في الشراب ثلاثًا',tEn:'Drinking in three breaths',
 bAr:'كان ﷺ يتنفّس في الشراب ثلاثًا خارج الإناء.',
 bEn:'He ﷺ would pause for breath three times while drinking, outside the vessel.',
 hAr:'قال أنس رضي الله عنه: «كَانَ رَسُولُ اللهِ ﷺ يَتَنَفَّسُ فِي الشَّرَابِ ثَلَاثًا»، ويقول: «إِنَّهُ أَرْوَى وَأَبْرَأُ وَأَمْرَأُ».',
 hEn:'Anas said: "The Messenger of Allah ﷺ used to breathe three times in the course of a drink," and he would say: "It is more quenching, healthier, and more wholesome."',
 nAr:'أنس بن مالك رضي الله عنه',nEn:'Anas ibn Malik (may Allah be pleased with him)',
 src:'Sahih Muslim 2028',srcAr:'صحيح مسلم ٢٠٢٨',grade:'sahih'},
{level:'day',anchor:'dhuhr',icon:'🙏',
 tAr:'الحمد بعد الطعام والشراب',tEn:'Praising Allah after eating and drinking',
 bAr:'إن الله ليرضى عن العبد يأكل الأكلة فيحمده عليها.',
 bEn:'Allah is pleased with the servant who eats a meal and praises Him for it.',
 hAr:'قال رسول الله ﷺ: «إِنَّ اللهَ لَيَرْضَى عَنِ العَبْدِ أَنْ يَأْكُلَ الأَكْلَةَ فَيَحْمَدَهُ عَلَيْهَا، أَوْ يَشْرَبَ الشَّرْبَةَ فَيَحْمَدَهُ عَلَيْهَا».',
 hEn:'The Messenger of Allah ﷺ said: "Indeed Allah is pleased with the servant who eats a meal and praises Him for it, or drinks a drink and praises Him for it."',
 nAr:'أنس بن مالك رضي الله عنه',nEn:'Anas ibn Malik (may Allah be pleased with him)',
 src:'Sahih Muslim 2734',srcAr:'صحيح مسلم ٢٧٣٤',grade:'sahih'},
{level:'day',anchor:'asr',icon:'💯',
 tAr:'التهليل مائة مرة',tEn:'The tahlil one hundred times',
 bAr:'عدل عشر رقاب، ومائة حسنة، وحرزٌ من الشيطان يومه حتى يمسي.',
 bEn:'Equal to freeing ten slaves, a hundred good deeds, and a shield from shaytan all day.',
 hAr:'قال رسول الله ﷺ: «مَنْ قَالَ: لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، فِي يَوْمٍ مِائَةَ مَرَّةٍ؛ كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ، وَكُتِبَتْ لَهُ مِائَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِائَةُ سَيِّئَةٍ، وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ يَوْمَهُ ذَلِكَ حَتَّى يُمْسِيَ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever says: There is no god but Allah alone without partner, His is the dominion and His is the praise, and He is over all things able, one hundred times in a day: it is equal to freeing ten slaves, a hundred good deeds are recorded for him, a hundred misdeeds erased, and it is a shield for him from shaytan that day until evening."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 3293 · Sahih Muslim 2691',srcAr:'صحيح البخاري ٣٢٩٣ · صحيح مسلم ٢٦٩١',grade:'muttafaq'},
{level:'day',anchor:'asr',icon:'🔄',
 tAr:'الاستغفار مائة مرة',tEn:'Istighfar one hundred times',
 bAr:'كان ﷺ يستغفر الله في اليوم مائة مرة.',
 bEn:'He ﷺ would seek Allah\u2019s forgiveness a hundred times a day.',
 hAr:'قال رسول الله ﷺ: «إِنَّهُ لَيُغَانُ عَلَى قَلْبِي، وَإِنِّي لَأَسْتَغْفِرُ اللهَ فِي اليَوْمِ مِائَةَ مَرَّةٍ». وقال: «وَاللهِ إِنِّي لَأَسْتَغْفِرُ اللهَ وَأَتُوبُ إِلَيْهِ فِي اليَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً».',
 hEn:'The Messenger of Allah ﷺ said: "Indeed my heart is (sometimes) veiled, and I seek Allah\u2019s forgiveness a hundred times a day." And he said: "By Allah, I seek forgiveness from Allah and turn to Him more than seventy times a day."',
 nAr:'الأغرّ المزني وأبو هريرة رضي الله عنهما',nEn:'al-Agharr al-Muzani & Abu Hurayrah (may Allah be pleased with them)',
 src:'Sahih Muslim 2702 · Sahih al-Bukhari 6307',srcAr:'صحيح مسلم ٢٧٠٢ · صحيح البخاري ٦٣٠٧',grade:'sahih'},
{level:'day',anchor:'maghrib',icon:'🏡',
 tAr:'ذكر الله عند دخول البيت والطعام',tEn:'Remembering Allah entering the home & at food',
 bAr:'يقول الشيطان لأتباعه حينها: لا مبيت لكم ولا عشاء.',
 bEn:'Shaytan then tells his followers: no lodging for you here, and no dinner.',
 hAr:'قال رسول الله ﷺ: «إِذَا دَخَلَ الرَّجُلُ بَيْتَهُ فَذَكَرَ اللهَ عِنْدَ دُخُولِهِ وَعِنْدَ طَعَامِهِ، قَالَ الشَّيْطَانُ: لَا مَبِيتَ لَكُمْ وَلَا عَشَاءَ، وَإِذَا دَخَلَ فَلَمْ يَذْكُرِ اللهَ عِنْدَ دُخُولِهِ قَالَ الشَّيْطَانُ: أَدْرَكْتُمُ المَبِيتَ...».',
 hEn:'The Messenger of Allah ﷺ said: "When a man enters his home and remembers Allah upon entering and at his food, shaytan says (to his troops): No lodging for you and no dinner. And when he enters without remembering Allah, shaytan says: You have found lodging..."',
 nAr:'جابر بن عبد الله رضي الله عنهما',nEn:'Jabir ibn ʿAbdillah (may Allah be pleased with them)',
 src:'Sahih Muslim 2018',srcAr:'صحيح مسلم ٢٠١٨',grade:'sahih'},
{level:'day',anchor:'maghrib',icon:'🕮',q:true,
 tAr:'سورة البقرة في البيت',tEn:'Surat al-Baqarah in the home',
 bAr:'إن الشيطان ينفر من البيت الذي تُقرأ فيه سورة البقرة.',
 bEn:'Shaytan flees from the house in which Surat al-Baqarah is recited.',
 hAr:'قال رسول الله ﷺ: «لَا تَجْعَلُوا بُيُوتَكُمْ مَقَابِرَ، إِنَّ الشَّيْطَانَ يَنْفِرُ مِنَ البَيْتِ الَّذِي تُقْرَأُ فِيهِ سُورَةُ البَقَرَةِ».',
 hEn:'The Messenger of Allah ﷺ said: "Do not turn your houses into graves. Indeed shaytan flees from the house in which Surat al-Baqarah is recited."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih Muslim 780',srcAr:'صحيح مسلم ٧٨٠',grade:'sahih'},
{level:'day',anchor:'night',icon:'🕮',q:true,
 tAr:'قراءة الوتر: الأعلى والكافرون والإخلاص',tEn:'Witr recitation: al-Aʿla, al-Kafirun, al-Ikhlas',
 bAr:'سورةٌ لكل ركعةٍ من ثلاث الوتر.',
 bEn:'One surah for each of the three rakʿahs of Witr.',
 hAr:'كان رسول الله ﷺ يوتر فيقرأ بـ«سَبِّحِ اسْمَ رَبِّكَ الأَعْلَى» و«قُلْ يَا أَيُّهَا الكَافِرُونَ» و«قُلْ هُوَ اللهُ أَحَدٌ».',
 hEn:'The Messenger of Allah ﷺ would pray Witr reciting "Glorify the Name of your Lord, the Most High," "Say: O disbelievers," and "Say: He is Allah, One."',
 nAr:'عبد الله بن عباس وأُبيّ بن كعب رضي الله عنهم',nEn:'Ibn ʿAbbas & Ubayy ibn Kaʿb (may Allah be pleased with them)',
 src:'al-Nasaʾi 1729 · Ibn Majah 1171 — graded Sahih by al-Albani',srcAr:'النسائي ١٧٢٩ · ابن ماجه ١١٧١ — صححه الألباني',grade:'sahih_albani'},
{level:'day',anchor:'night',icon:'🌃',
 tAr:'دعاء الثلث الأخير من الليل',tEn:'The duʿa of the last third of the night',
 bAr:'ينزل ربنا كل ليلة فيقول: من يدعوني فأستجيب له؟',
 bEn:'Our Lord descends every night saying: Who calls on Me, that I may answer him?',
 hAr:'قال رسول الله ﷺ: «يَنْزِلُ رَبُّنَا تَبَارَكَ وَتَعَالَى كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الآخِرُ، يَقُولُ: مَنْ يَدْعُونِي فَأَسْتَجِيبَ لَهُ؟ مَنْ يَسْأَلُنِي فَأُعْطِيَهُ؟ مَنْ يَسْتَغْفِرُنِي فَأَغْفِرَ لَهُ؟».',
 hEn:'The Messenger of Allah ﷺ said: "Our Lord, Blessed and Exalted, descends every night to the lowest heaven when the last third of the night remains, saying: Who calls upon Me, that I may answer him? Who asks of Me, that I may give him? Who seeks My forgiveness, that I may forgive him?"',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 1145 · Sahih Muslim 758',srcAr:'صحيح البخاري ١١٤٥ · صحيح مسلم ٧٥٨',grade:'muttafaq'},
{level:'day',anchor:'sleep',icon:'🕮',q:true,
 tAr:'المعوِّذات في الكفّين قبل النوم',tEn:'The three Quls into cupped hands before sleep',
 bAr:'جمعُ الكفّين والنفث فيهما بالإخلاص والمعوِّذتين ومسحُ الجسد، ثلاثًا.',
 bEn:'Cupping the hands, blowing into them with the three Quls, and wiping the body, three times.',
 hAr:'قالت عائشة رضي الله عنها: «كَانَ النَّبِيُّ ﷺ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ جَمَعَ كَفَّيْهِ ثُمَّ نَفَثَ فِيهِمَا، فَقَرَأَ فِيهِمَا: قُلْ هُوَ اللهُ أَحَدٌ، وَقُلْ أَعُوذُ بِرَبِّ الفَلَقِ، وَقُلْ أَعُوذُ بِرَبِّ النَّاسِ، ثُمَّ يَمْسَحُ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ، يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ وَمَا أَقْبَلَ مِنْ جَسَدِهِ، يَفْعَلُ ذَلِكَ ثَلَاثَ مَرَّاتٍ».',
 hEn:'ʿAʾishah said: "Every night when the Prophet ﷺ went to his bed, he would cup his hands together, blow into them, recite into them: Say, He is Allah, One; Say, I seek refuge with the Lord of the daybreak; and Say, I seek refuge with the Lord of mankind; then wipe with them whatever he could of his body, beginning with his head, his face, and the front of his body, doing that three times."',
 nAr:'عائشة رضي الله عنها',nEn:'ʿAʾishah (may Allah be pleased with her)',
 src:'Sahih al-Bukhari 5017',srcAr:'صحيح البخاري ٥٠١٧',grade:'sahih'},
{level:'day',anchor:'sleep',icon:'🕮',q:true,
 tAr:'خواتيم سورة البقرة',tEn:'The last two verses of al-Baqarah',
 bAr:'من قرأهما في ليلةٍ كفتاه.',
 bEn:'Whoever recites them in a night, they suffice him.',
 hAr:'قال رسول الله ﷺ: «مَنْ قَرَأَ بِالآيَتَيْنِ مِنْ آخِرِ سُورَةِ البَقَرَةِ فِي لَيْلَةٍ كَفَتَاهُ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever recites the last two verses of Surat al-Baqarah in a night, they will suffice him."',
 nAr:'أبو مسعود الأنصاري رضي الله عنه',nEn:'Abu Masʿud al-Ansari (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 5009 · Sahih Muslim 808',srcAr:'صحيح البخاري ٥٠٠٩ · صحيح مسلم ٨٠٨',grade:'muttafaq'},
{level:'day',anchor:'sleep',icon:'🧹',
 tAr:'نفض الفراش',tEn:'Dusting the bed',
 bAr:'فإنه لا يدري ما خلَفه عليه بعده.',
 bEn:'For one does not know what came onto it after him.',
 hAr:'قال رسول الله ﷺ: «إِذَا أَوَى أَحَدُكُمْ إِلَى فِرَاشِهِ فَلْيَنْفُضْ فِرَاشَهُ بِدَاخِلَةِ إِزَارِهِ، فَإِنَّهُ لَا يَدْرِي مَا خَلَفَهُ عَلَيْهِ».',
 hEn:'The Messenger of Allah ﷺ said: "When one of you goes to his bed, let him dust off his bedding with the inside of his lower garment, for he does not know what came onto it after him."',
 nAr:'أبو هريرة رضي الله عنه',nEn:'Abu Hurayrah (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 6320 · Sahih Muslim 2714',srcAr:'صحيح البخاري ٦٣٢٠ · صحيح مسلم ٢٧١٤',grade:'muttafaq'},
{level:'day',anchor:'sleep',icon:'✨',
 tAr:'تسبيح فاطمة قبل النوم',tEn:'The tasbih of Fatimah before sleep',
 bAr:'٣٣ تسبيحة و٣٣ تحميدة و٣٤ تكبيرة: خيرٌ لكما من خادم.',
 bEn:'33 tasbih, 33 tahmid, 34 takbir: better for you both than a servant.',
 hAr:'قال النبي ﷺ لعليٍّ وفاطمة: «أَلَا أَدُلُّكُمَا عَلَى خَيْرٍ لَكُمَا مِنْ خَادِمٍ؟ إِذَا أَوَيْتُمَا إِلَى فِرَاشِكُمَا، أَوْ أَخَذْتُمَا مَضَاجِعَكُمَا، فَكَبِّرَا أَرْبَعًا وَثَلَاثِينَ، وَسَبِّحَا ثَلَاثًا وَثَلَاثِينَ، وَاحْمَدَا ثَلَاثًا وَثَلَاثِينَ، فَهُوَ خَيْرٌ لَكُمَا مِنْ خَادِمٍ».',
 hEn:'The Prophet ﷺ said to ʿAli and Fatimah: "Shall I not direct you both to what is better for you than a servant? When you go to your bed, say Allahu akbar thirty-four times, subhanAllah thirty-three times, and alhamdulillah thirty-three times; that is better for you than a servant."',
 nAr:'علي بن أبي طالب رضي الله عنه',nEn:'ʿAli ibn Abi Talib (may Allah be pleased with him)',
 src:'Sahih al-Bukhari 3705 · Sahih Muslim 2727',srcAr:'صحيح البخاري ٣٧٠٥ · صحيح مسلم ٢٧٢٧',grade:'muttafaq'},
{level:'day',anchor:'sleep',icon:'🕮',q:true,
 tAr:'الكافرون: براءة من الشرك',tEn:'Al-Kafirun: freedom from shirk',
 bAr:'اقرأها ثم نم على خاتمتها.',
 bEn:'Recite it, then sleep upon its conclusion.',
 hAr:'قال رسول الله ﷺ: «اقْرَأْ: قُلْ يَا أَيُّهَا الكَافِرُونَ، ثُمَّ نَمْ عَلَى خَاتِمَتِهَا، فَإِنَّهَا بَرَاءَةٌ مِنَ الشِّرْكِ».',
 hEn:'The Messenger of Allah ﷺ said: "Recite: Say, O disbelievers, then sleep upon its conclusion, for it is a declaration of freedom from shirk."',
 nAr:'نوفل الأشجعي رضي الله عنه',nEn:'Nawfal al-Ashjaʿi (may Allah be pleased with him)',
 src:'Abu Dawud 5055 — graded Sahih by al-Albani',srcAr:'أبو داود ٥٠٥٥ — صححه الألباني',grade:'sahih_albani'},
{level:'day',anchor:'sleep',icon:'🕮',q:true,
 tAr:'السجدة والملك قبل النوم',tEn:'Al-Sajdah & al-Mulk before sleep',
 bAr:'سورةُ ثلاثين آيةً تشفع لصاحبها حتى يُغفر له.',
 bEn:'A surah of thirty verses that intercedes for its companion until he is forgiven.',
 hAr:'قال جابر رضي الله عنه: «كَانَ النَّبِيُّ ﷺ لَا يَنَامُ حَتَّى يَقْرَأَ: الم تَنْزِيلُ، وَتَبَارَكَ الَّذِي بِيَدِهِ المُلْكُ». وقال ﷺ: «إِنَّ سُورَةً مِنَ القُرْآنِ ثَلَاثُونَ آيَةً شَفَعَتْ لِرَجُلٍ حَتَّى غُفِرَ لَهُ، وَهِيَ سُورَةُ تَبَارَكَ الَّذِي بِيَدِهِ المُلْكُ».',
 hEn:'Jabir said: "The Prophet ﷺ would not sleep until he recited Alif-Lam-Mim Tanzil (al-Sajdah) and Tabarak alladhi bi yadihil-mulk (al-Mulk)." And he ﷺ said: "There is a surah in the Qurʾan of thirty verses which interceded for a man until he was forgiven; it is Tabarak alladhi bi yadihil-mulk."',
 nAr:'جابر وأبو هريرة رضي الله عنهما',nEn:'Jabir & Abu Hurayrah (may Allah be pleased with them)',
 src:'al-Tirmidhi 2892 · 2891 — graded Sahih by al-Albani',srcAr:'الترمذي ٢٨٩٢ · ٢٨٩١ — صححه الألباني',grade:'sahih_albani',
 noteAr:'تنبيه: حديث المداومة قبل النوم صححه الألباني، وأعلّه ابن أبي حاتم وابن حجر؛ وحديث فضل السورة وشفاعتها حسّنه الترمذي وصححه ابن تيمية والألباني.',
 noteEn:'Note: al-Albani graded the nightly-habit report sahih, while Ibn Abi Hatim and Ibn Hajar considered it defective; the intercession hadith itself was graded hasan by al-Tirmidhi and sahih by Ibn Taymiyyah and al-Albani.'},

{level:'occ',anchor:'dua',icon:'🧭',
 tAr:'صلاة الاستخارة',tEn:'The Istikharah prayer',
 bAr:'علّمها النبي ﷺ أصحابه في الأمور كلها كما يعلمهم السورة من القرآن.',
 bEn:'He ﷺ taught it for all matters as he taught a surah of the Qurʾan.',
 hAr:'قال جابر رضي الله عنه: كَانَ رَسُولُ اللهِ ﷺ يُعَلِّمُنَا الِاسْتِخَارَةَ فِي الأُمُورِ كُلِّهَا كَمَا يُعَلِّمُنَا السُّورَةَ مِنَ القُرْآنِ، يَقُولُ: «إِذَا هَمَّ أَحَدُكُمْ بِالأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الفَرِيضَةِ، ثُمَّ لِيَقُلْ: اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ العَظِيمِ...».',
 hEn:'Jabir said: The Messenger of Allah ﷺ used to teach us istikharah in all matters as he taught us a surah of the Qurʾan, saying: "When one of you intends a matter, let him pray two rakʿahs other than the obligatory, then say: O Allah, I seek Your guidance by Your knowledge, and Your strength by Your power, and I ask You of Your great bounty..."',
 nAr:'جابر بن عبد الله رضي الله عنهما',nEn:'Jabir ibn ʿAbdillah (may Allah be pleased with them)',
 src:'Sahih al-Bukhari 1162',srcAr:'صحيح البخاري ١١٦٢',grade:'sahih'},
{level:'occ',anchor:'dua',icon:'⚓',
 tAr:'دعاء الكرب',tEn:'The duʿa of distress',
 bAr:'كلماتُ النبي ﷺ عند الشدائد.',
 bEn:'The Prophet\u2019s ﷺ words at moments of hardship.',
 hAr:'كان النبي ﷺ يقول عند الكرب: «لَا إِلَهَ إِلَّا اللهُ العَظِيمُ الحَلِيمُ، لَا إِلَهَ إِلَّا اللهُ رَبُّ العَرْشِ العَظِيمِ، لَا إِلَهَ إِلَّا اللهُ رَبُّ السَّمَوَاتِ وَرَبُّ الأَرْضِ وَرَبُّ العَرْشِ الكَرِيمِ».',
 hEn:'At times of distress the Prophet ﷺ would say: "There is no god but Allah, the Magnificent, the Forbearing; there is no god but Allah, Lord of the Magnificent Throne; there is no god but Allah, Lord of the heavens, Lord of the earth, and Lord of the Noble Throne."',
 nAr:'عبد الله بن عباس رضي الله عنهما',nEn:'ʿAbdullah ibn ʿAbbas (may Allah be pleased with them both)',
 src:'Sahih al-Bukhari 6346 · Sahih Muslim 2730',srcAr:'صحيح البخاري ٦٣٤٦ · صحيح مسلم ٢٧٣٠',grade:'muttafaq'},
{level:'occ',anchor:'dua',icon:'🪶',
 tAr:'كفّارة المجلس',tEn:'The expiation of the gathering',
 bAr:'خاتمةٌ تغفر لغطَ المجلس كله.',
 bEn:'A closing that forgives all the idle talk of the gathering.',
 hAr:'قال رسول الله ﷺ: «مَنْ جَلَسَ فِي مَجْلِسٍ فَكَثُرَ فِيهِ لَغَطُهُ، فَقَالَ قَبْلَ أَنْ يَقُومَ مِنْ مَجْلِسِهِ ذَلِكَ: سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ؛ إِلَّا غُفِرَ لَهُ مَا كَانَ فِي مَجْلِسِهِ ذَلِكَ».',
 hEn:'The Messenger of Allah ﷺ said: "Whoever sits in a gathering in which there is much idle talk, and says before rising: Glory and praise be to You, O Allah; I bear witness that there is no god but You; I seek Your forgiveness and turn to You — except that he is forgiven what took place in that gathering."',
